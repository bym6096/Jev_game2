<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>구슬 공방 — 헥스 프로토타입</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>구슬 공방 <small>헥스 프로토타입</small></h1>
    <div class="top-actions">
      <label>스테이지
        <select id="stype"><option value="balanced">균형</option><option value="hostile">적 많음</option><option value="rich">자원 많음</option></select>
      </label>
      <button id="newgame" type="button">새 게임</button>
    </div>
  </header>

  <main id="app" hidden>
    <section id="setup" hidden>
      <div class="setup-head">
        <h2>빈 구슬에 이름을 쓰세요</h2>
        <p>빈 구슬에는 말이 미리 새겨져 있을 수 있습니다. 다시 뽑을 수 없으니 받은 그대로 빈칸을 채우세요. Jev가 이름을 읽어 구슬의 효과를 정합니다(말이 일반 새겨진 말이면 합쳐진 전체 이름을, <b>힌트</b>가 붙어 있으면 내가 쓴 이름만 읽습니다). 힌트는 따라도 되고 무시해도 됩니다 — 이름이 그 계열이면 효과가 ×1.2가 됩니다.</p>
      </div>
      <div id="blanks"></div>
      <div class="setup-foot">
        <button id="start" class="primary big" type="button">스테이지 시작</button>
        <span id="setup-note"></span>
      </div>
      <details class="bagbox"><summary>가진 구슬 (시작 8개)</summary><div id="bagnames" class="chips"></div></details>
    </section>

    <section id="play" hidden>
      <div id="hud" aria-label="상태"></div>
      <div class="stage">
        <div class="mapwrap">
          <svg id="map" viewBox="-336 -302 672 604" role="img" aria-label="헥스 맵"></svg>
          <div id="toast" role="status" aria-live="polite"></div>
        </div>
        <aside>
          <div id="turnpreview" class="box"></div>
          <div id="inspect" class="box"></div>
          <div id="effects" class="box" hidden></div>
          <div id="forecast" class="box"></div>
          <div class="box logbox"><h3>기록</h3><div id="log"></div></div>
        </aside>
      </div>
      <div class="dock">
        <div id="hand" role="list"></div>
        <div class="turnctl">
          <div id="piles" class="piles"></div>
          <button id="undo" type="button" title="직전 행동을 되돌립니다 (Z)">되돌리기<kbd>Z</kbd></button>
          <button id="endturn" class="primary" type="button">턴 종료<kbd>Space</kbd></button>
        </div>
      </div>
    </section>
  </main>

  <div id="over" class="modal" hidden></div>
</div>
<script src="/app.js"></script>
</body>
</html>
