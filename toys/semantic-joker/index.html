<title>심야 감정소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 한 화면 게임 보드. 위 = 빚 목표와 감정사 줄, 가운데 = 점수판, 아래 = 손패와 버튼 */
:root{
  --bg:#17120f; --felt:#221a15; --panel:#2c221b; --line:#4a3a2e;
  --card:#efe3cc; --card-ink:#2a1f17; --muted:#a8937c; --fg:#f3e8d6;
  --brass:#d9a441; --chips:#5aa9c9; --mult:#e0624a; --good:#8fc46a;
  --f-display:"Do Hyeon","Black Han Sans",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;color:var(--brass);letter-spacing:.02em}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;min-width:84px}
.stat small{color:var(--muted);font-size:12px}
.stat b{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.stat.debt b{color:var(--brass)}
.section-label{font-size:13px;color:var(--muted);margin-bottom:6px}
.jokers{display:flex;flex-wrap:wrap;gap:10px;min-height:96px}
.joker{width:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;position:relative;transition:transform .15s, border-color .15s}
.joker .jn{font-family:var(--f-display);font-size:18px}
.joker .jc{font-size:13px;color:var(--muted);line-height:1.35}
.joker .je{font-family:var(--f-num);font-size:13px}
.joker.lit{border-color:var(--brass);transform:translateY(-4px)}
.empty-slot{width:150px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;min-height:90px}
.board{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center;font-family:var(--f-num);font-size:22px}
.pill{border-radius:8px;padding:6px 14px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.pill.c{background:var(--chips);color:#0e1d24}.pill.m{background:var(--mult);color:#2a0d07}.pill.x{background:#b48ad8;color:#1d0f29}
.total{font-size:26px;color:var(--brass)}
.played{display:flex;justify-content:center;gap:10px;min-height:132px;flex-wrap:wrap}
.hand{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.card{width:112px;min-height:124px;background:var(--card);color:var(--card-ink);border-radius:10px;padding:10px 9px 8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  border:2px solid transparent;box-shadow:0 2px 0 #0006;transition:transform .12s;position:relative;user-select:none}
.card:hover{transform:translateY(-3px)}
.card.sel{transform:translateY(-14px);border-color:var(--brass)}
.card.burnt{background:#d8c3a6;background-image:radial-gradient(circle at 70% 20%,#3a2a1e55,transparent 55%)}
.card.frozen{background:#dbe9ef}
.card .cn{font-family:var(--f-display);font-size:18px;line-height:1.15}
.card .tag{font-size:11px;font-weight:600;letter-spacing:.04em}
.card .tag.burnt{color:#8a3b1c}.card .tag.frozen{color:#2b6d8a}
.card .ps{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:4px;font-size:10.5px}
.prow span:first-child{flex:0 0 46px;overflow:hidden;white-space:nowrap;text-overflow:clip}
.bar{flex:1;height:5px;background:#0002;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--card-ink)}
.card.scoring{border-color:var(--brass);transform:translateY(-8px)}
.float{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-family:var(--f-num);font-weight:600;font-size:15px;pointer-events:none;
  padding:1px 6px;border-radius:6px;animation:up .7s ease-out forwards;white-space:nowrap}
.float.c{background:var(--chips);color:#0e1d24}.float.m{background:var(--mult);color:#2a0d07}.float.x{background:#b48ad8;color:#1d0f29}
@keyframes up{from{opacity:1;transform:translate(-50%,-90%)}to{opacity:0;transform:translate(-50%,-180%)}}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
button{font-family:var(--f-display);font-size:18px;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button.primary{background:var(--brass);color:#2a1a05;border-color:var(--brass)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.card:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.tool.armed{border-color:var(--brass);color:var(--brass)}
.msg{text-align:center;color:var(--muted);min-height:22px;font-size:14px}
.overlay{position:fixed;inset:0;background:#0b0806e6;display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:760px;width:100%;display:flex;flex-direction:column;gap:14px}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--brass)}
.dialog p{margin:0;line-height:1.6}
.offers{display:flex;flex-wrap:wrap;gap:12px}
.offer{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.offer .joker{width:170px}
.price{font-family:var(--f-num);color:var(--brass);text-align:center}
.log{font-size:12.5px;color:var(--muted);max-height:120px;overflow:auto;font-family:var(--f-num)}
.toggle{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
@media (max-width:560px){.card{width:96px;min-height:116px}.joker,.empty-slot{width:46%}.scorebar{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <h1>심야 감정소</h1>
    <div class="stats">
      <div class="stat debt"><small>이번 빚</small><b id="sTarget">0</b></div>
      <div class="stat"><small>모은 돈</small><b id="sScore">0</b></div>
      <div class="stat"><small>남은 패</small><b id="sHands">0</b></div>
      <div class="stat"><small>버리기</small><b id="sDisc">0</b></div>
      <div class="stat"><small>지갑</small><b id="sMoney">0</b></div>
      <div class="stat"><small>기한</small><b id="sBlind">1/5</b></div>
    </div>
  </div>

  <div>
    <div class="section-label">고용한 감정사 (최대 4명) · 물건이 취향에 맞는 정도만큼 값을 더합니다</div>
    <div class="jokers" id="jokers"></div>
  </div>

  <div class="board">
    <div class="scorebar"><span class="pill c" id="bChips">0</span>×<span class="pill m" id="bMult">0</span><span id="bXwrap" hidden>×<span class="pill x" id="bX">1</span></span>=<span class="total" id="bTotal">0</span></div>
    <div class="played" id="played"></div>
    <div class="msg" id="msg">물건을 1~5개 골라 감정을 맡기세요.</div>
    <div class="hand" id="hand"></div>
    <div class="controls">
      <div class="tools" id="tools"></div>
      <button class="primary" id="btnPlay">감정 맡기기</button>
      <button id="btnDiscard">돌려보내기</button>
      <label class="toggle"><input type="checkbox" id="showP" checked> 감정사 취향 보기</label>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>

const JIDS = Object.keys(JOKER_DEF);
const ITEM_KO = Object.fromEntries(DATA.items.map(i=>[i[0],i[1]]));
const VAR_KO = {"":"", burnt:"불탄 ", frozen:"얼어붙은 "};
const TOOLS = {burn:{name:"성냥", desc:"손패의 물건 하나를 영원히 불태웁니다"}, freeze:{name:"냉동고", desc:"손패의 물건 하나를 영원히 얼립니다"}};
const TARGETS = [400, 1500, 4000, 9000, 18000];
const HAND_SIZE = 7, HANDS = 4, DISCARDS = 3, BASE_CHIP = 10;
const JOKER_PRICE = 6, TOOL_PRICE = 3, REROLL = 2;

let S;
function fresh(){
  S = {deck: DATA.items.map((it,i)=>({uid:i, iid:it[0], v:""})), draw:[], hand:[], sel:new Set(),
       jokers:[], tools:[], money:4, blind:0, score:0, hands:HANDS, disc:DISCARDS, armed:null, busy:false, log:[]};
}
const pOf = (c,j) => P[c.iid + (c.v ? ":"+c.v : "")][j];
const nameOf = c => VAR_KO[c.v] + ITEM_KO[c.iid];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startBlind(){S.draw=shuffle(S.deck.slice());S.hand=[];S.score=0;S.hands=HANDS;S.disc=DISCARDS;S.sel.clear();refill();}
function refill(){while(S.hand.length<HAND_SIZE&&S.draw.length)S.hand.push(S.draw.pop());}
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const $ = id => document.getElementById(id);
function log(t){S.log.unshift(t);S.log=S.log.slice(0,30);$("log").innerHTML=S.log.map(x=>`<div>${x}</div>`).join("");}

function jokerHTML(id, extra=""){
  const d=JOKER_DEF[id];
  const eff = d.kind==="chips"?`<span style="color:var(--chips)">물건마다 +${d.val} 칩 × 취향</span>`
            : d.kind==="mult"?`<span style="color:var(--mult)">물건마다 +${d.val} 배수 × 취향</span>`
            : `<span style="color:#b48ad8">물건마다 ×(1+${d.val}×취향) 배수</span>`;
  return `<div class="joker" data-j="${id}" ${extra}><div class="jn">${d.name}</div><div class="jc">"${d.cond}"을 좋아함</div><div class="je">${eff}</div></div>`;
}
function cardHTML(c, idx, where){
  const show=$("showP").checked && S.jokers.length;
  const rows = show ? S.jokers.map(j=>{const p=pOf(c,j);return `<div class="prow"><span>${JOKER_DEF[j].name}</span><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div><span>${Math.round(p*100)}</span></div>`}).join("") : "";
  const tag = c.v ? `<div class="tag ${c.v}">${c.v==="burnt"?"불탐":"얼어붙음"}</div>` : "";
  const sel = where==="hand" && S.sel.has(idx) ? " sel":"";
  return `<div class="card ${c.v}${sel}" tabindex="0" role="button" data-i="${idx}" data-w="${where}" aria-label="${nameOf(c)}">${tag}<div class="cn">${ITEM_KO[c.iid]}</div><div class="ps">${rows}</div></div>`;
}
function render(){
  $("sTarget").textContent=fmt(TARGETS[S.blind]);$("sScore").textContent=fmt(S.score);
  $("sHands").textContent=S.hands;$("sDisc").textContent=S.disc;$("sMoney").textContent="$"+S.money;$("sBlind").textContent=`${S.blind+1}/${TARGETS.length}`;
  let jh=S.jokers.map(j=>jokerHTML(j)).join("");for(let i=S.jokers.length;i<4;i++)jh+=`<div class="empty-slot">빈 자리</div>`;
  $("jokers").innerHTML=jh;
  $("hand").innerHTML=S.hand.map((c,i)=>cardHTML(c,i,"hand")).join("");
  $("tools").innerHTML=S.tools.map((t,i)=>`<button class="tool${S.armed===i?" armed":""}" data-t="${i}" title="${TOOLS[t].desc}">${TOOLS[t].name}</button>`).join("");
  $("btnPlay").disabled=S.busy||!S.sel.size||!S.hands;$("btnDiscard").disabled=S.busy||!S.sel.size||!S.disc;
  if(!S.busy) previewScore();
}
function previewScore(){
  const cards=[...S.sel].map(i=>S.hand[i]);
  if(!cards.length){setBar(0,0,1,0);return;}
  const r=score(cards);setBar(r.chips,r.mult,r.x,r.total);
}
function setBar(c,m,x,t){$("bChips").textContent=fmt(c);$("bMult").textContent=(Math.round(m*10)/10).toLocaleString("ko-KR");
  $("bXwrap").hidden = x<=1.001; $("bX").textContent=(Math.round(x*100)/100).toFixed(2);$("bTotal").textContent=fmt(t);}
function score(cards){
  let chips=BASE_CHIP*cards.length, mult=1, x=1; const steps=[];
  for(const j of S.jokers){const d=JOKER_DEF[j];
    cards.forEach((c,ci)=>{const p=pOf(c,j);
      if(d.kind==="chips"){const a=d.val*p;chips+=a;steps.push({ci,j,kind:"c",amt:a,p});}
      else if(d.kind==="mult"){const a=d.val*p;mult+=a;steps.push({ci,j,kind:"m",amt:a,p});}
      else {const f=1+d.val*p;x*=f;steps.push({ci,j,kind:"x",amt:f,p});}
    });}
  return {chips,mult,x,total:chips*mult*x,steps};
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
async function play(){
  if(S.busy||!S.sel.size||!S.hands)return;S.busy=true;
  const idxs=[...S.sel].sort((a,b)=>a-b);const cards=idxs.map(i=>S.hand[i]);
  S.hand=S.hand.filter((_,i)=>!S.sel.has(i));S.sel.clear();S.hands--;render();
  $("played").innerHTML=cards.map((c,i)=>cardHTML(c,i,"played")).join("");
  const r=score(cards);let chips=BASE_CHIP*cards.length,mult=1,x=1;setBar(chips,mult,x,0);
  const pc=[...$("played").children];
  for(const st of r.steps){
    if(st.kind==="c")chips+=st.amt;else if(st.kind==="m")mult+=st.amt;else x*=st.amt;
    if(st.p<0.08) continue;
    const el=pc[st.ci], jel=document.querySelector(`#jokers .joker[data-j="${st.j}"]`);
    el.classList.add("scoring");jel&&jel.classList.add("lit");
    setBar(chips,mult,x,chips*mult*x);
    const f=document.createElement("div");f.className="float "+st.kind;
    f.textContent= st.kind==="c"?`+${Math.round(st.amt)}` : st.kind==="m"?`+${(Math.round(st.amt*10)/10)}` : `×${st.amt.toFixed(2)}`;
    el.appendChild(f);
    await sleep(reduced?40:170+ (st.p>0.7?90:0));
    el.classList.remove("scoring");jel&&jel.classList.remove("lit");
  }
  setBar(r.chips,r.mult,r.x,r.total);
  S.score+=r.total;log(`${cards.map(nameOf).join(", ")} → ${fmt(r.total)}`);
  await sleep(reduced?100:650);
  $("played").innerHTML="";refill();S.busy=false;
  if(S.score>=TARGETS[S.blind]) return clearBlind();
  if(!S.hands) return lose();
  render();
}
function discard(){ if(S.busy||!S.sel.size||!S.disc)return;
  S.hand=S.hand.filter((_,i)=>!S.sel.has(i));S.sel.clear();S.disc--;refill();render();}
function clearBlind(){
  const earn=4+S.hands;S.money+=earn;log(`빚 ${fmt(TARGETS[S.blind])} 상환 완료. 수입 $${earn}`);
  if(S.blind===TARGETS.length-1) return win();
  S.blind++;shop(true);
}
function offers(){
  const pool=JIDS.filter(j=>!S.jokers.includes(j));shuffle(pool);
  const tl=shuffle(Object.keys(TOOLS)).slice(0,1);
  return [...pool.slice(0,2).map(j=>({type:"joker",id:j})), ...tl.map(t=>({type:"tool",id:t}))];
}
function shop(newOffers){
  if(newOffers) S.offers=offers();
  const o=S.offers.map((x,i)=>{
    if(x.sold) return `<div class="offer"><div class="empty-slot" style="width:170px">팔림</div></div>`;
    const price=x.type==="joker"?JOKER_PRICE:TOOL_PRICE;
    const body = x.type==="joker"? jokerHTML(x.id) : `<div class="joker" style="width:170px"><div class="jn">${TOOLS[x.id].name}</div><div class="jc">${TOOLS[x.id].desc}</div><div class="je" style="color:var(--muted)">감정 값이 바뀝니다</div></div>`;
    const full = x.type==="joker"? S.jokers.length>=4 : S.tools.length>=2;
    return `<div class="offer">${body}<div class="price">$${price}</div><button data-buy="${i}" ${S.money<price||full?"disabled":""}>${full?"자리 없음":"사기"}</button></div>`;
  }).join("");
  dialog(`<h2>뒷골목 상점</h2><p>다음 빚: <b style="color:var(--brass)">${fmt(TARGETS[S.blind])}</b> · 지갑 <b>$${S.money}</b></p>
    <div class="offers">${o}</div>
    <div class="controls" style="justify-content:flex-start"><button id="reroll" ${S.money<REROLL?"disabled":""}>새로 진열 ($${REROLL})</button><button class="primary" id="next">다음 기한으로</button></div>`);
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const x=S.offers[+b.dataset.buy];const price=x.type==="joker"?JOKER_PRICE:TOOL_PRICE;
    if(S.money<price)return;S.money-=price;x.sold=true;(x.type==="joker"?S.jokers:S.tools).push(x.id);shop(false);});
  $("reroll").onclick=()=>{S.money-=REROLL;shop(true);};
  $("next").onclick=()=>{closeDialog();startBlind();render();};
}
function startPick(){
  const pool=shuffle(JIDS.slice()).slice(0,3);
  dialog(`<h2>심야 감정소에 오신 걸 환영합니다</h2>
    <p>당신은 빚에 쫓기는 전당포 주인입니다. 손님이 맡긴 물건을 1~5개씩 감정사에게 맡기면, 감정사들은 <b>자기 취향에 맞는 정도만큼</b> 값을 매깁니다. 기한마다 빚을 갚지 못하면 가게를 잃습니다.</p>
    <p>값 = 칩 × 배수. 상점에서 감정사를 더 고용하고, 성냥이나 냉동고로 물건의 성질을 바꿔 보세요. 불탄 생일 케이크는 더 이상 달콤하지 않지만, 누군가는 슬퍼할지도 모릅니다.</p>
    <p class="section-label" style="margin:0">첫 감정사를 한 명 고르세요</p>
    <div class="offers">${pool.map(j=>`<div class="offer">${jokerHTML(j)}<button class="primary" data-pick="${j}">고용</button></div>`).join("")}</div>`);
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.jokers.push(b.dataset.pick);closeDialog();startBlind();render();});
}
function lose(){dialog(`<h2>가게를 잃었습니다</h2><p>${S.blind+1}번째 기한, ${fmt(S.score)} / ${fmt(TARGETS[S.blind])}</p><div class="controls" style="justify-content:flex-start"><button class="primary" id="again">다시 시작</button></div>`);$("again").onclick=restart;}
function win(){dialog(`<h2>빚을 모두 갚았습니다</h2><p>감정사들: ${S.jokers.map(j=>JOKER_DEF[j].name).join(", ")}</p><div class="controls" style="justify-content:flex-start"><button class="primary" id="again">한 판 더</button></div>`);$("again").onclick=restart;}
function dialog(h){$("dialog").innerHTML=h;$("overlay").hidden=false;}
function closeDialog(){$("overlay").hidden=true;}
function restart(){closeDialog();fresh();render();startPick();}

$("hand").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c||S.busy)return;const i=+c.dataset.i;
  if(S.armed!==null){const t=S.tools[S.armed];const card=S.hand[i];const was=nameOf(card);card.v= t==="burn"?"burnt":"frozen";
    const deckCard=S.deck.find(d=>d.uid===card.uid); if(deckCard) deckCard.v=card.v;
    S.tools.splice(S.armed,1);S.armed=null;$("msg").textContent=`${was} → ${nameOf(card)}`;log(`${was} → ${nameOf(card)}`);render();return;}
  if(S.sel.has(i))S.sel.delete(i);else if(S.sel.size<5)S.sel.add(i);render();});
$("hand").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.target.click();}});
$("tools").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;const i=+b.dataset.t;S.armed=S.armed===i?null:i;
  $("msg").textContent=S.armed===null?"":`${TOOLS[S.tools[i]].name}: 손패에서 물건을 하나 고르세요`;render();});
$("btnPlay").onclick=play;$("btnDiscard").onclick=discard;$("showP").onchange=render;
fresh();render();startPick();
</script>
