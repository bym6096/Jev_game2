<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말 짓기 회색 박스</title>
<style>
:root { --bg:#1d1d1f; --panel:#2a2a2d; --line:#3d3d42; --text:#e8e8ea; --dim:#9a9aa2; --accent:#e0b04a; --good:#5fbf6f; --bad:#d9605a;
  --ref:#4f7ad6; --adj:#4fb3b8; --pred:#4fa86a; --mod:#c9a23f; --pol:#9a6bd1; --int:#d16b9a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
main { max-width:760px; margin:0 auto; padding:16px; }
header { display:flex; gap:16px; flex-wrap:wrap; color:var(--dim); font-size:14px; margin-bottom:12px; }
header b { color:var(--text); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
h3 { margin:0 0 8px; font-size:14px; color:var(--dim); font-weight:600; }
.sit-title { font-size:18px; font-weight:700; }
.sit-desc { color:var(--dim); margin-top:2px; }
.goal { margin-top:6px; font-size:14px; }
.goal b { color:var(--accent); }
.meter { display:flex; gap:6px; margin-top:10px; }
.pip { width:28px; height:10px; border-radius:3px; background:var(--line); }
.pip.on { background:var(--good); }
.info { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--dim); margin-top:6px; }
.talk { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.talk .me { align-self:flex-end; background:#4a4232; border-radius:10px 10px 2px 10px; padding:6px 10px; max-width:85%; }
.talk .them { align-self:flex-start; color:var(--dim); font-size:14px; padding:0 4px; }
.row { display:flex; flex-wrap:wrap; gap:8px; }
.tile { border:2px solid; background:#2f2f34; color:var(--text); border-radius:8px; padding:7px 11px; font-size:15px; cursor:pointer; position:relative; }
.tile.ref { border-color:var(--ref); } .tile.pred { border-color:var(--pred); } .tile.mod { border-color:var(--mod); } .tile.pol { border-color:var(--pol); } .tile.adj { border-color:var(--adj); } .tile.int { border-color:var(--int); }
.tile.rare { background:#3a3424; } .tile.rare::before { content:"★"; color:var(--accent); font-size:11px; margin-right:3px; }
.tile.used { opacity:.25; cursor:default; }
.tile small { display:block; font-size:11px; color:var(--dim); line-height:1.1; }
.slots { display:flex; gap:6px; flex-wrap:wrap; min-height:48px; align-items:center; }
.slots .empty { color:var(--dim); font-size:14px; }
.slots .tile .x { position:absolute; top:-8px; right:-8px; background:#555; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:18px; text-align:center; }
.acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.act { background:#3a3a40; border:1px solid #55555c; color:var(--text); border-radius:999px; padding:5px 12px; font-size:14px; cursor:pointer; }
.act.on { background:var(--accent); color:#1d1d1f; border-color:var(--accent); font-weight:700; }
.said { font-size:20px; margin-top:12px; min-height:30px; }
.btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
button.go { background:var(--accent); color:#1d1d1f; border:0; border-radius:8px; padding:10px 16px; font-weight:700; font-size:15px; cursor:pointer; }
button.go.sec { background:#44444a; color:var(--text); }
button:disabled { opacity:.35; cursor:default; }
.bar { display:flex; height:26px; border-radius:6px; overflow:hidden; position:relative; margin-top:8px; }
.bar div { display:flex; align-items:center; justify-content:center; font-size:12px; color:#111; white-space:nowrap; overflow:hidden; }
.needle { position:absolute; top:-4px; bottom:-4px; width:3px; background:#fff; box-shadow:0 0 6px #fff; transition:left .9s cubic-bezier(.2,.8,.2,1); }
.legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:4px; }
.result { font-size:17px; margin-top:8px; }
.cats { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-bottom:8px; }
.cats i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
.log { font-size:13px; color:var(--dim); max-height:140px; overflow:auto; }
.log div { border-top:1px solid var(--line); padding:4px 0; }
</style>
</head>
<body>
<main>
  <header>
    <span>상황 <b id="stage"></b></span>
    <span>목숨 <b id="hearts"></b></span>
    <span>주머니 <b id="bagn"></b></span>
  </header>
  <div class="panel">
    <div class="sit-title" id="sitTitle"></div>
    <div class="sit-desc" id="sitDesc"></div>
    <div class="goal">목표: <b id="goal"></b></div>
    <div class="meter" id="meter"></div>
    <div class="info" id="info"></div>
    <div class="talk" id="talk"></div>
  </div>
  <div class="panel">
    <h3>지을 말 — 조각을 눌러 넣고(최대 5개), 넣은 <span style="color:var(--ref)">지시 조각</span>을 누르면 역할이 바뀐다</h3>
    <div class="slots" id="slots"></div>
    <div class="acts" id="acts"></div>
    <div class="said" id="said"></div>
    <div class="btns">
      <button class="go sec" id="peekBtn">떠보기</button>
      <button class="go" id="sayBtn">말하기</button>
      <button class="go sec" id="clearBtn">비우기</button>
    </div>
    <div id="judge"></div>
  </div>
  <div class="panel">
    <div class="cats"><span><i style="background:var(--ref)"></i>누구·무엇</span><span><i style="background:var(--adj)"></i>어떤</span><span><i style="background:var(--pred)"></i>일·상태</span><span><i style="background:var(--mod)"></i>얼마나·언제</span><span><i style="background:var(--pol)"></i>부정·확신</span><span><i style="background:var(--int)"></i>부름·감탄</span><span>★ 희귀</span></div>
    <div class="row" id="hand"></div>
  </div>
  <div class="panel" id="rewardPanel" hidden></div>
  <div class="panel"><h3>기록</h3><div class="log" id="log"></div></div>
</main>
<script>
const NEED=3, LINES=3, PEEKS=2, HAND=10, MAXLEN=5, RUN=6;
const OUT_KEYS=["great","good","little","none","worse"];
const OUT_KO={great:"대성공 +3", good:"통함 +2", little:"조금 +1", none:"무반응 0", worse:"역효과 −1"};
const OUT_PTS={great:3, good:2, little:1, none:0, worse:-1};
const OUT_COL={great:"#7fdc8a", good:"#5fbf6f", little:"#b8c46a", none:"#8a8a90", worse:"#d9605a"};
const ROLE_KO={"":"", subj:"누가", obj:"무엇을", to:"누구에게"};
const ROLE_NEXT={"":"subj", subj:"obj", obj:"to", to:""};
const ACCESS=new URLSearchParams(location.search).get("code")||"";
let D, TILES, S;
const cache={};  // 같은 대화 흐름에서 같은 말은 늘 같은 확률(정직함)

// ---- 한국어 렌더러: jev.py의 render_ko와 같은 규칙 ----
const batchim=w=>{const c=w.charCodeAt(w.length-1)-0xAC00; return c>=0&&c<11172&&c%28!==0;};
function predForm(p,act){
  switch(act){
    case "assert": return [p.h,"."]; case "ask": return [p.h,"?"];
    case "plead": return p.ko==="주다"?["줘",", 제발."]:[p.h+" 줘","."];
    case "command": return [p.h+"라","!"]; case "promise": return [p.l+"게","."];
    case "threaten": return [p.l+" 거야",". 두고 봐!"]; case "exclaim": return [p.ne||p.st+"네","!"];
    case "suggest": return [p.st+"자","."];
  }
}
function nounForm(w,act){
  const cop=batchim(w)?"이야":"야";
  return {assert:[w+cop,"."], ask:[w+cop,"?"], plead:[w+" 줘",", 제발."], command:[w+" 내놔","!"], promise:[w+" 줄게","."],
    threaten:[w+cop,". 두고 봐!"], exclaim:[w+(batchim(w)?"이네":"네"),"!"], suggest:[w+" 하자","."]}[act];
}
function withRole(w,role){
  if(role==="subj") return ({"나":"내가","너":"네가"})[w]||w+(batchim(w)?"이":"가");
  if(role==="obj") return w+(batchim(w)?"을":"를");
  if(role==="to") return w+"에게";
  return w;
}
function render(specs,act){
  const all=specs.map(s=>{const [id,role=""]=s.split(":"); return [TILES[id],role];});
  const ints=all.filter(([t])=>t.cat==="int").map(([t])=>t.ko);   // 부름·감탄은 문장 앞으로
  const ts=all.filter(([t])=>t.cat!=="int");
  if(!ts.length) return ints.join(", ")+"!";
  const head=ints.length?ints.join(", ")+", ":"";
  const preds=ts.map(([t],n)=>t.cat==="pred"?n:-1).filter(n=>n>=0);
  const last=preds.length?preds[preds.length-1]:ts.length-1;
  let end=""; const words=ts.map(([t,role],n)=>{
    if(n===last){ const [c,e]=t.cat==="pred"?predForm(t,act):nounForm(t.ko,act); end=e; return c; }
    return t.cat==="pred"?t.st+"고":withRole(t.ko,role);
  });
  return head+words.join(" ")+end;
}

// ---- 진행 ----
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;};
function newRun(){
  S={stage:0, hearts:3, bag:shuffle([...D.start]), discard:[], hand:[], acts:[...D.start_acts], sits:shuffle(D.situations.map(s=>s.id)).slice(0,RUN), log:[], over:false};
  startSituation();
}
function startSituation(){
  Object.assign(S,{progress:0, lines:LINES, peeks:PEEKS, pick:[], act:S.acts[0], history:[], judged:null, result:null, busy:false});
  S.discard.push(...S.hand); S.hand=[]; draw(); paint();
}
function draw(){ while(S.hand.length<HAND){ if(!S.bag.length){ if(!S.discard.length) break; S.bag=shuffle(S.discard); S.discard=[]; } S.hand.push(S.bag.pop()); } }
const sit=()=>D.situations.find(s=>s.id===S.sits[S.stage]);
const specs=()=>S.pick.map(p=>S.hand[p.i]+(p.role?":"+p.role:""));
const hist=()=>S.history.map(h=>({tiles:h.tiles, act:h.act, reaction:h.reaction}));
async function ask(){
  const body={sit:sit().id, tiles:specs(), act:S.act, history:hist()};
  const key=JSON.stringify(body); if(cache[key]) return cache[key];
  const r=await fetch("api/judge",{method:"POST",headers:{"Content-Type":"application/json","X-Access-Code":ACCESS},body:key});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||r.status); return cache[key]=d;
}
async function peek(){
  if(S.busy||!S.pick.length||!S.peeks) return; S.busy=true; S.result=null; paint();
  try{ const d=await ask(); S.judged=d; S.peeks--; addLog(`떠보기 「${d.said}」`); } catch(e){ addLog("판정 실패: "+e.message); }
  S.busy=false; paint();
}
async function say(){
  if(S.busy||!S.pick.length||!S.lines) return; S.busy=true; S.result=null; paint();
  let d; try{ d=await ask(); } catch(e){ addLog("판정 실패: "+e.message); S.busy=false; paint(); return; }
  const roll=Math.random(); let acc=0, out="worse";
  for(const k of OUT_KEYS){ acc+=d.outcome[k]||0; if(roll<acc){ out=k; break; } }
  const reaction=Object.entries(d.reaction).sort((a,b)=>b[1]-a[1])[0][0];
  S.judged=d; S.result={roll,out,reaction};
  S.history.push({tiles:specs(), act:S.act, reaction, said:d.said, out});
  S.progress=Math.max(0,S.progress+OUT_PTS[out]); S.lines--;
  addLog(`「${d.said}」 → ${sit().who}: ${D.reactions[reaction]} (${OUT_KO[out]})`);
  const used=new Set(S.pick.map(p=>p.i)); S.discard.push(...S.hand.filter((_,i)=>used.has(i))); S.hand=S.hand.filter((_,i)=>!used.has(i)); S.pick=[]; draw();
  paint(); await new Promise(r=>setTimeout(r,1100)); S.busy=false;
  if(S.progress>=NEED) return endSituation(true);
  if(!S.lines) return endSituation(false);
  paint();
}
function endSituation(won){
  if(won) addLog(`✔ ${sit().name}: 목표 달성`); else { S.hearts--; addLog(`✘ ${sit().name}: 실패 — 목숨 −1`); }
  if(S.hearts<=0) return showEnd(false);
  if(S.stage+1>=RUN) return showEnd(true);
  showReward(won);
}
function showReward(won){
  const p=document.getElementById("rewardPanel"); p.hidden=false;
  const all=[...S.bag,...S.discard,...S.hand];
  const fresh=D.tiles.filter(t=>!all.includes(t.id));
  const common=shuffle(fresh.filter(t=>!t.rare).map(t=>t.id)), rare=shuffle(fresh.filter(t=>t.rare).map(t=>t.id));
  const picks=won?[common[0],common[1],rare[0]]:[common[0],common[1]];
  const offers=picks.filter(Boolean).map(id=>({tile:id}));
  const newActs=Object.keys(D.acts).filter(a=>!S.acts.includes(a));
  if(won&&newActs.length) offers.push({act:shuffle(newActs)[0]});
  p.innerHTML=`<h3>${won?"목표 달성! ":""}하나를 얻거나, 조각 하나를 버린다</h3>
    <div class="row">${offers.map(o=>o.act?`<button class="act" data-addact="${o.act}">+ 말투: ${D.acts[o.act].ko}</button>`:tileBtn(o.tile,`data-add="${o.tile}"`,"+ ")).join("")}</div>
    <h3 style="margin-top:12px">버리기</h3>
    <div class="row">${[...new Set(all)].map(id=>tileBtn(id,`data-del="${id}"`,"− ")).join("")}</div>
    <div class="btns"><button class="go sec" data-skip="1">건너뛰기</button></div>`;
  p.onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.add){ S.discard.push(b.dataset.add); addLog(`조각 얻음: ${TILES[b.dataset.add].ko}`); }
    else if(b.dataset.addact){ S.acts.push(b.dataset.addact); addLog(`말투 얻음: ${D.acts[b.dataset.addact].ko}`); }
    else if(b.dataset.del){ for(const arr of [S.bag,S.discard,S.hand]){ const i=arr.indexOf(b.dataset.del); if(i>=0){ arr.splice(i,1); break; } } addLog(`조각 버림: ${TILES[b.dataset.del].ko}`); }
    else if(!b.dataset.skip) return;
    p.hidden=true; p.onclick=null; S.stage++; startSituation();
  };
  paint();
}
function showEnd(won){
  const p=document.getElementById("rewardPanel"); p.hidden=false; S.over=true;
  p.innerHTML=`<h3>${won?"런 완주!":"런 종료"} — 상황 ${S.stage+1}/${RUN}</h3><div class="btns"><button class="go" id="again">다시 하기</button></div>`;
  document.getElementById("again").onclick=()=>{ p.hidden=true; newRun(); };
  paint();
}
function addLog(t){ S.log.unshift(t); }

// ---- 그리기 ----
const tileBtn=(id,attr,prefix="",sub="")=>{const t=TILES[id]; return `<button class="tile ${t.cat}${t.rare?" rare":""}" ${attr}>${prefix}${t.ko}${sub}</button>`;};
function paint(){
  const s=sit(), lock=S.busy||S.over||!document.getElementById("rewardPanel").hidden;
  document.getElementById("stage").textContent=`${S.stage+1}/${RUN}`;
  document.getElementById("hearts").textContent="♥".repeat(Math.max(0,S.hearts));
  document.getElementById("bagn").textContent=`${S.bag.length} (버림 ${S.discard.length}) · 말투 ${S.acts.length}`;
  document.getElementById("sitTitle").textContent=s.name;
  document.getElementById("sitDesc").textContent=s.desc;
  document.getElementById("goal").textContent=s.goal;
  document.getElementById("meter").innerHTML=Array.from({length:NEED},(_,i)=>`<div class="pip ${i<S.progress?"on":""}"></div>`).join("");
  document.getElementById("info").innerHTML=`<span>진척 ${S.progress}/${NEED}</span><span>남은 말 ${S.lines}</span><span>남은 떠보기 ${S.peeks}</span>`;
  document.getElementById("talk").innerHTML=S.history.map(h=>`<div class="me">${h.said}</div><div class="them">→ ${s.who}이(가) ${D.reactions[h.reaction]} · ${OUT_KO[h.out]}</div>`).join("");
  document.getElementById("slots").innerHTML=S.pick.length?S.pick.map((p,n)=>tileBtn(S.hand[p.i],`data-slot="${n}"`,"",`${p.role?`<small>${ROLE_KO[p.role]}</small>`:""}<span class="x" data-unpick="${n}">✕</span>`)).join(""):`<span class="empty">아래 조각을 눌러 말을 짓는다</span>`;
  document.getElementById("acts").innerHTML=S.acts.map(a=>`<button class="act ${a===S.act?"on":""}" data-act="${a}">${D.acts[a].ko}</button>`).join("");
  document.getElementById("said").textContent=S.pick.length?`「${render(specs(),S.act)}」`:"";
  document.getElementById("hand").innerHTML=S.hand.map((id,i)=>tileBtn(id,`data-pick="${i}"`).replace('class="tile',`class="tile ${S.pick.some(p=>p.i===i)?"used":""}`)).join("");
  document.getElementById("peekBtn").textContent=`떠보기 (${S.peeks})`;
  document.getElementById("peekBtn").disabled=lock||!S.pick.length||!S.peeks;
  document.getElementById("sayBtn").disabled=lock||!S.pick.length||!S.lines;
  document.getElementById("clearBtn").disabled=lock||!S.pick.length;
  document.getElementById("judge").innerHTML=S.busy&&!S.result?`<div class="result">${s.who}이(가) 듣고 있다…</div>`:judgeHTML();
  document.getElementById("log").innerHTML=S.log.map(t=>`<div>${t}</div>`).join("");
}
function judgeHTML(){
  if(!S.judged) return "";
  const d=S.judged, r=S.result;
  const bars=OUT_KEYS.map(k=>{const p=d.outcome[k]||0; return `<div style="width:${p*100}%;background:${OUT_COL[k]}">${p>.08?Math.round(p*100)+"%":""}</div>`;}).join("");
  const reacts=Object.entries(d.reaction).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,p])=>`${D.reactions[k]} ${Math.round(p*100)}%`).join(" · ");
  if(r) requestAnimationFrame(()=>requestAnimationFrame(()=>{const n=document.getElementById("needle"); if(n) n.style.left=(r.roll*100)+"%";}));
  return `<div style="margin-top:12px">「${d.said}」${r?"":" — 떠보기"}</div>
    <div class="bar">${bars}${r?`<div class="needle" id="needle" style="left:0%"></div>`:""}</div>
    <div class="legend">${OUT_KEYS.map(k=>`<span style="color:${OUT_COL[k]}">■ ${OUT_KO[k]}</span>`).join("")}</div>
    <div class="legend">${sit().who}의 반응: ${reacts}</div>
    ${r?`<div class="result" style="color:${OUT_COL[r.out]}">${OUT_KO[r.out]}</div>`:""}`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||S.busy||S.over||!document.getElementById("rewardPanel").hidden) return;
  if(e.target.dataset.unpick!==undefined){ S.pick.splice(+e.target.dataset.unpick,1); }
  else if(b.dataset.pick!==undefined){ const i=+b.dataset.pick; if(!S.pick.some(p=>p.i===i)&&S.pick.length<MAXLEN) S.pick.push({i,role:""}); }
  else if(b.dataset.slot!==undefined){ const p=S.pick[+b.dataset.slot]; if(TILES[S.hand[p.i]].cat==="ref") p.role=ROLE_NEXT[p.role]; }
  else if(b.dataset.act){ S.act=b.dataset.act; }
  else if(b.id==="peekBtn") return peek();
  else if(b.id==="sayBtn") return say();
  else if(b.id==="clearBtn"){ S.pick=[]; }
  else return;
  paint();
});
fetch("data.json").then(r=>r.json()).then(d=>{ D=d; TILES=Object.fromEntries(d.tiles.map(t=>[t.id,t])); newRun(); });
</script>
</body>
</html>
