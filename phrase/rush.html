<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄 러시</title>
<style>
:root { --bg:#111114; --panel:#1c1c21; --line:#33333a; --text:#efeff2; --dim:#8f8f98; --accent:#ffd24a; --good:#6fe08f; --bad:#ff6b61;
  --ref:#5b8cff; --adj:#3fc1c9; --pred:#5dbb6f; --mod:#e0a93f; --part:#c58cff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
main { max-width:720px; margin:0 auto; padding:12px 16px 24px; }
.top { display:flex; align-items:center; gap:12px; }
.top .brand { font-weight:900; letter-spacing:-.4px; }
.top .brand a { color:var(--dim); font-weight:500; font-size:12px; margin-left:6px; }
.top .score { margin-left:auto; font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; }
.combo { font-size:13px; color:var(--accent); font-weight:800; text-align:right; }
.timer { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 10px; }
.timer div { height:100%; background:var(--good); transition:width .25s linear; }
.timer div.low { background:var(--bad); }
.goal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; text-align:center; position:relative; }
.goal .lab { font-size:12px; color:var(--dim); }
.goal .vibe.theme { font-size:21px; letter-spacing:-.5px; line-height:1.3; margin:4px 0; }
.goal .vibe { font-size:28px; font-weight:900; letter-spacing:-1px; }
.goal.hard { border:1.5px solid var(--bad); background:#241618; }
.hardtag { color:var(--bad); font-weight:900; letter-spacing:.5px; }
.conds { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:4px; min-height:20px; }
.cond { font-size:12px; color:var(--accent); border:1px solid #ffd24a55; border-radius:999px; padding:1px 8px; }
.goal.hard .cond { color:#ffb0aa; border-color:#ff6b6155; }
.goal .next { position:absolute; right:12px; top:8px; font-size:12px; color:var(--dim); }
.canvas { position:relative; height:170px; margin-top:10px; border:1.5px dashed var(--line); border-radius:12px; overflow:hidden;
  background:repeating-linear-gradient(to bottom, transparent 0 41px, #ffffff0a 41px 42px), #16161a; touch-action:none; }
.canvas.over { border-color:var(--accent); }
.canvas .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; pointer-events:none; text-align:center; padding:0 20px; }
.chip { position:absolute; }
.ends { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.end { background:#25252b; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:4px 12px; font-size:15px; cursor:pointer; min-width:42px; }
.end.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:800; }
.said { font-size:21px; font-weight:800; margin:10px 0 4px; min-height:30px; letter-spacing:-.3px; }
.meter { display:flex; gap:10px; font-size:12px; color:var(--dim); margin:0 0 8px; font-variant-numeric:tabular-nums; }
.meter .hot { color:var(--accent); }
.btns { display:flex; gap:8px; }
button.go { flex:1; background:var(--accent); color:#111; border:0; border-radius:12px; padding:13px; font-weight:900; font-size:17px; cursor:pointer; }
button.go.sec { flex:0 0 auto; background:#2a2a30; color:var(--text); font-weight:600; font-size:14px; padding:13px 14px; }
button:disabled { opacity:.35; cursor:default; }
.fb { min-height:44px; margin-top:8px; font-size:14px; color:var(--dim); }
.fb b { font-size:18px; color:var(--text); }
.fb .pts { color:var(--accent); font-weight:900; font-size:20px; }
.parts { font-size:12px; color:var(--dim); margin-top:2px; }
.hand { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.hrow { display:flex; flex-wrap:wrap; gap:6px; }
.tile { border:1.5px solid; background:#232328; color:var(--text); border-radius:9px; padding:6px 10px; font-size:15px; cursor:grab; touch-action:none; white-space:nowrap; }
.tile.ref{border-color:var(--ref)} .tile.adj{border-color:var(--adj)} .tile.pred{border-color:var(--pred)} .tile.mod{border-color:var(--mod)}
.tile.part { border-color:var(--part); border-style:dashed; padding:5px 9px; font-size:14px; }
.tile.place { border-color:#f08c5a; border-style:dashed; padding:5px 9px; font-size:14px; }
.tile.rare { background:#352f1f; } .tile.rare::before { content:"★"; color:var(--accent); font-size:10px; margin-right:3px; }
.tile.need { box-shadow:0 0 0 2px var(--accent); }
.tile.used { opacity:.2; }
.tile.fresh { animation:pop .35s; }
.tile.dragging { opacity:.25; }
.palette { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
.palette .lab { font-size:11px; color:var(--dim); width:100%; }
.ghost { position:fixed; z-index:50; pointer-events:none; box-shadow:0 6px 18px #0008; }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
.over-screen { text-align:center; padding:28px 12px; }
.over-screen .big { font-size:48px; font-weight:900; }
.over-screen ol { text-align:left; display:inline-block; margin:12px 0; color:var(--dim); }
.over-screen ol b { color:var(--accent); }
.start { text-align:center; padding:40px 12px; color:var(--dim); }
.start h1 { color:var(--text); font-size:30px; margin:0 0 8px; }
.modes { display:flex; gap:6px; justify-content:center; padding:10px 16px 0; max-width:780px; margin:0 auto; }
.modes a { font-size:13px; font-weight:700; color:#8f8f98; text-decoration:none; padding:5px 14px; border-radius:999px; border:1px solid #33333a; }
.modes a.on { color:#111; background:#ffd24a; border-color:#ffd24a; }
</style>
</head>
<body>
<nav class="modes"><a href="./">한 줄 공방</a><a href="rush.html" class="on">한 줄 러시</a><a href="puzzle.html">한 줄 퍼즐</a></nav>
<script>document.querySelectorAll(".modes a").forEach(a=>{ a.href=a.getAttribute("href")+location.search; });   // 접근 코드(?code=)를 다음 화면에도 넘긴다</script>
<main id="app"></main>
<script>
const TIME=180, HIT_BONUS=3, HIT_LAND=.55, LEN_K=.4, MAX_WORDS=8;
const ROWS={ref:8, adj:6, mod:4, pred:6}, FLOW_MS=6000, SKIP_COST=3, NEED_P=.35, AUD_P=.15, STYLE_P=.2, RARE_P=.12;
const HARD_EVERY=5, HARD_MULT=2, HARD_BONUS=8, HARD_SKIP=6;   // 다섯 번째마다 빡센 목표: 점수 ×2, 꽂으면 +8초, 넘기면 −6초
const CAT_KO={ref:"누구·무엇", adj:"꾸밈말", mod:"어떻게", pred:"서술어", part:"조사"};
const ENDS=[".","!","?","…","ㅋㅋ","ㅠㅠ"], ROW_H=42;
const LAND_KO={strong:"확실히 꽂힘", some:"꽤 통함", bit:"살짝", none:"안 느껴짐", opposite:"반대로 감"};
const ACCESS=new URLSearchParams(location.search).get("code")||"";
let D, T, P, L, G, S, timerId, flowId, uid=0;

// ---- 한국어 렌더러: jev.py render_free_ko와 같은 규칙 ----
const code=w=>w.charCodeAt(w.length-1)-0xAC00;
const batchim=w=>{const c=code(w); return c>=0&&c<11172&&c%28!==0;};
const jong=w=>{const c=code(w); return c>=0&&c<11172?c%28:0;};
function attach(w,pid){
  const p=P[pid];
  if(pid==="subj"&&(w==="나"||w==="너")) return w==="나"?"내가":"네가";
  if(pid==="dir"){ const j=jong(w); return w+(j&&j!==8?"으로":"로"); }
  return w+(batchim(w)?p.b:p.nb);
}
function renderTokens(tokens,end){
  let last=-1; tokens.forEach((k,i)=>{ if(k.t&&T[k.t].cat==="pred") last=i; });
  const out=[];
  tokens.forEach((k,i)=>{
    if(k.p){ if(out.length) out[out.length-1]=attach(out[out.length-1],k.p); return; }
    if(k.l){ out.push(L[k.l].ko); return; }   // 위치 말: 띄어 쓴 한 낱말(상자 안 → +에서 → 상자 안에서)
    const t=T[k.t]; out.push(t.cat==="pred"?(i===last?t.h:t.st+"고"):t.ko);
  });
  return out.length?out.join(" ")+end:"";
}

// ---- 도화지: 놓인 조각을 위→아래, 왼→오른 순서로 읽는다 ----
const order=()=>[...S.items].sort((a,b)=>(Math.floor(a.y/ROW_H)-Math.floor(b.y/ROW_H))||(a.x-b.x));
const tokens=()=>order().map(it=>it.kind==="p"?{p:it.id}:it.kind==="l"?{l:it.id}:{t:it.id});
const label=it=>it.kind==="p"?P[it.id].ko:it.kind==="l"?L[it.id].ko:T[it.id].ko;
const words=()=>S.items.filter(it=>it.kind==="t");
const onCanvas=id=>S.items.some(it=>it.kind==="t"&&it.id===id);
function appendAt(kind,id){   // 누르면 맨 끝 다음 자리에 놓는다
  const cv=document.getElementById("canvas"); if(!cv) return;
  const W=cv.clientWidth, o=order(), last=o[o.length-1];
  let x=10, y=8;
  if(last){ const el=cv.querySelector(`[data-uid="${last.uid}"]`); const w=el?el.offsetWidth:60; x=last.x+w+6; y=Math.floor(last.y/ROW_H)*ROW_H+8;
    const est=label({kind,id}).length*16+28; if(x+est>W-6){ x=10; y+=ROW_H; } }
  if(y>cv.clientHeight-30) return;
  S.items.push({uid:++uid, kind, id, x, y});
}

// ---- 진행 ----
const pick=a=>a[Math.floor(Math.random()*a.length)];
function randTile(cat,avoid){ const pool=D.tiles.filter(t=>t.cat===cat&&!avoid.has(t.id)&&(Math.random()<RARE_P?true:!t.rare)); return pick(pool).id; }
const inHand=()=>new Set(Object.values(S.hand).flat());
function fill(cat){ const av=inHand(); while(S.hand[cat].length<ROWS[cat]){ const id=randTile(cat,av); av.add(id); S.hand[cat].push(id); S.fresh.add(id); } }
function rollNext(){   // 다음 목표의 종류와 느낌(또는 주제)을 미리 정한다
  const hard=(S.goals+1)%HARD_EVERY===0;
  if(hard) return {hard, theme:pick(Object.keys(D.rush.themes).filter(t=>!S.usedThemes.has(t)))||pick(Object.keys(D.rush.themes))};
  const vibe=Math.random()<STYLE_P?pick(Object.keys(D.rush.styles)):pick(Object.keys(D.rush.vibes));
  return {hard, vibe};
}
function newGoal(){
  const nx=S.next||rollNext(); S.goals++;
  let g;
  if(nx.hard){   // 빡센 목표: 제한은 없고 주제가 어렵다
    g={theme:nx.theme, vibes:[], audience:null, rules:{}, hard:true, at:performance.now()}; S.usedThemes.add(nx.theme);
  } else {
    g={vibes:[nx.vibe], audience:null, rules:{}, hard:false, at:performance.now()};
    if(Math.random()<NEED_P) g.rules.need=[pick(S.hand.ref)];
    if(Math.random()<AUD_P) g.audience=pick(Object.keys(D.rush.audiences));
  }
  S.goal=g; S.next=rollNext();
}
const needs=()=>S.goal.rules.need||[];
const goalLabel=g=>g.theme?D.rush.themes[g.theme]:g.vibes.map(v=>G[v]).join(" + ");
function start(){
  S={goals:0, next:null, usedThemes:new Set(), t:TIME, score:0, combo:0, hand:Object.fromEntries(Object.keys(ROWS).map(c=>[c,[]])), fresh:new Set(), items:[], end:".", lines:[], fb:null, busy:false, over:false, goal:null};
  for(const c in ROWS) fill(c);
  newGoal(); paint();
  clearInterval(timerId); clearInterval(flowId);
  timerId=setInterval(()=>{ S.t=Math.max(0,S.t-.25); if(S.t<=0) finish(); paintTop(); paintMeter(); },250);
  flowId=setInterval(flow,FLOW_MS);
}
function flow(){   // 조각이 흘러간다: 줄마다 안 쓴 조각 하나가 새것으로
  if(S.over||drag) return;
  for(const c in ROWS){
    const cand=S.hand[c].map((id,i)=>[id,i]).filter(([id])=>!onCanvas(id)&&!needs().includes(id));
    if(!cand.length) continue;
    const [,i]=pick(cand); const id=randTile(c,inHand()); S.hand[c][i]=id; S.fresh.add(id);
  }
  const el=document.getElementById("hand"); if(el){ el.innerHTML=handHTML(); S.fresh.clear(); }
}
function finish(){ if(S.over) return; S.over=true; clearInterval(timerId); clearInterval(flowId); paint(); }
function problem(){
  const w=words(), n=w.length, r=S.goal.rules;
  if(!n) return "낱말을 올려놓는다";
  if(n>MAX_WORDS) return `낱말은 ${MAX_WORDS}개까지`;
  for(const id of r.need||[]) if(!onCanvas(id)) return `'${T[id].ko}' 넣기`;
  for(const c of r.ban||[]){ if(c==="part"?S.items.some(it=>it.kind!=="t"):w.some(it=>T[it.id].cat===c)) return `${CAT_KO[c]} 빼기`; }
  if(r.words_eq&&n!==r.words_eq) return `낱말 정확히 ${r.words_eq}개`;
  if(r.words_min&&n<r.words_min) return `낱말 ${r.words_min}개 이상`;
  return "";
}
async function send(){
  if(S.busy||S.over||problem()) return;
  S.busy=true; paintControls();
  const toks=tokens();
  const goal=S.goal.theme?{theme:S.goal.theme}:{vibes:S.goal.vibes, audience:S.goal.audience, rules:S.goal.rules};
  const body={mode:"rush", goal, tokens:toks, ending:S.end,
    history:S.lines.slice(-5).map(l=>({tokens:l.tokens, ending:l.end}))};
  let d;
  try{ const r=await fetch("api/judge",{method:"POST",headers:{"Content-Type":"application/json","X-Access-Code":ACCESS},body:JSON.stringify(body)}); d=await r.json(); if(!r.ok) throw new Error(d.error||r.status); }
  catch(e){ S.fb={err:e.message}; S.busy=false; paint(); return; }
  if(S.over){ S.busy=false; return; }
  const hit=d.land_ev>=HIT_LAND, hard=S.goal.hard;   // 콤보·시간 보너스는 점수가 아니라 꽂힘으로
  if(hit) S.t=Math.min(TIME,S.t+(hard?HARD_BONUS:HIT_BONUS));
  S.combo=hit?S.combo+1:0;
  const mult=Math.min(3,1+.25*Math.max(0,S.combo-1))*(hard?HARD_MULT:1), pts=Math.round(d.score*mult);
  S.score+=pts;
  S.lines.push({tokens:toks, end:S.end, said:d.said, label:goalLabel(S.goal), hard, pts});
  S.fb={said:d.said, land:d.land_top, pts, mult, d, hit, hard};
  const used=new Set(words().map(it=>it.id));
  for(const c in ROWS){ S.hand[c]=S.hand[c].filter(id=>!used.has(id)); fill(c); }
  S.items=[]; S.end="."; newGoal(); S.busy=false; paint();
}
function skip(){ if(S.over||S.busy) return; S.t=Math.max(0,S.t-(S.goal.hard?HARD_SKIP:SKIP_COST)); S.combo=0; S.fb={skip:true}; S.end="."; newGoal(); paint(); }

// ---- 그리기 ----
const app=document.getElementById("app");
const tileHTML=(id,extra="",attr=`data-tile="${id}"`)=>{const t=T[id]; return `<button class="tile ${t.cat}${t.rare?" rare":""}${extra}" ${attr}>${t.ko}</button>`;};
function paint(){
  if(!S){ app.innerHTML=`<div class="start"><h1>한 줄 러시</h1><p>${TIME}초. 떨어지는 목표에 맞는 한 줄을 빠르게 지어 보낸다.<br>
    낱말 조각과 조사를 도화지에 끌어다 놓는다. 위에서 아래로, 왼쪽에서 오른쪽으로 읽은 순서가 문장이 된다.<br>
    조사는 무제한. 누르면 끝에 붙고, 도화지 밖으로 끌어내면 빠진다.<br>
    잘 꽂으면 +${HIT_BONUS}초, 연속으로 꽂으면 콤보. ${HARD_EVERY}번째마다 주제가 어려운 <b style="color:var(--bad)">빡센 목표</b>(×${HARD_MULT}, +${HARD_BONUS}초).<br> 길게 지을수록 배율이 붙는다 — 단, 꽂히고 말이 되는 만큼만. 짧게 여러 줄을 이어 꽂을지, 길게 한 방을 노릴지.</p>
    <button class="go" id="startBtn" style="max-width:260px">시작</button></div>`; return; }
  if(S.over){
    const best=[...S.lines].sort((a,b)=>b.pts-a.pts).slice(0,5);
    app.innerHTML=`<div class="over-screen"><div>끝!</div><div class="big">${S.score}</div><div style="color:var(--dim)">${S.lines.length}줄</div>
      <ol>${best.map(l=>`<li>「${l.said}」 ${l.hard?"🔥":""}${l.label} <b>+${l.pts}</b></li>`).join("")}</ol>
      <div><button class="go" id="startBtn" style="max-width:260px">다시</button></div></div>`; return;
  }
  const g=S.goal;
  app.innerHTML=`
    <div class="top"><span class="brand">한 줄 러시</span><span class="combo" id="tleft" style="color:var(--dim)"></span><span class="combo" id="combo"></span><span class="score" id="score"></span></div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="goal ${g.hard?"hard":""}"><span class="next">다음: ${S.next.hard?"<b style=\"color:var(--bad)\">빡센 목표</b>":G[S.next.vibe]}</span>
      <div class="lab">${g.hard?`<span class="hardtag">빡센 목표 ×${HARD_MULT}</span> · 이 장면이 떠오르게`:"이 느낌으로"}</div>
      <div class="vibe ${g.theme?"theme":""}">${goalLabel(g)}</div>
      <div class="conds">${condChips(g)}</div></div>
    <div class="canvas" id="canvas">${S.items.length?"":`<div class="hint">낱말과 조사를 여기에 끌어다 놓는다</div>`}${S.items.map(it=>{
      const html=it.kind==="t"?tileHTML(it.id,"",`data-item="${it.uid}"`):`<button class="tile ${it.kind==="p"?"part":"place"}" data-item="${it.uid}">${label(it)}</button>`;
      return `<div class="chip" data-uid="${it.uid}" style="left:${it.x}px;top:${it.y}px">${html}</div>`;}).join("")}</div>
    <div class="ends">${ENDS.map(e=>`<button class="end ${e===S.end?"on":""}" data-end="${e}" ${g.rules.ending&&e!==g.rules.ending?"disabled":""}>${e}</button>`).join("")}</div>
    <div class="said">${S.items.length?`「${renderTokens(tokens(),S.end)}」`:""}</div>
    <div class="meter" id="meter"></div>
    <div class="btns"><button class="go" id="sendBtn">보내기</button><button class="go sec" id="clearBtn">비우기</button><button class="go sec" id="skipBtn">넘기기 −${g.hard?HARD_SKIP:SKIP_COST}초</button></div>
    <div class="fb">${fbHTML()}</div>
    <div class="hand" id="hand">${handHTML()}</div>
    <div class="palette"><span class="lab">조사 — 무제한</span>${D.particles.map(p=>`<button class="tile part" data-part="${p.id}">${p.ko}</button>`).join("")}
      <span class="lab" style="margin-top:4px">위치 — 무제한 (상자 + 안 + 에서 → 상자 안에서)</span>${D.places.map(p=>`<button class="tile place" data-place="${p.id}">${p.ko}</button>`).join("")}</div>`;
  S.fresh.clear(); paintTop(); paintControls(); paintMeter();
}
function condChips(g){
  const r=g.rules, c=[];
  if(g.audience) c.push(`듣는 사람: ${D.rush.audiences[g.audience]}`);
  for(const id of r.need||[]) c.push(`'${T[id].ko}' 넣기`);
  for(const x of r.ban||[]) c.push(`${CAT_KO[x]} 금지`);
  if(r.words_eq) c.push(`낱말 정확히 ${r.words_eq}개`);
  if(r.words_min) c.push(`낱말 ${r.words_min}개 이상`);
  if(r.ending) c.push(`'${r.ending}'로 끝내기`);
  return c.map(x=>`<span class="cond">${x}</span>`).join("");
}
function handHTML(){
  return Object.keys(ROWS).map(c=>`<div class="hrow">${S.hand[c].map(id=>tileHTML(id,`${onCanvas(id)?" used":""}${needs().includes(id)?" need":""}${S.fresh.has(id)?" fresh":""}`)).join("")}</div>`).join("");
}
function paintTop(){
  if(!S||S.over) return;
  const sc=document.getElementById("score"); if(sc) sc.textContent=S.score;
  const cb=document.getElementById("combo"); if(cb) cb.textContent=S.combo>1?`${S.combo}콤보 ×${Math.min(3,1+.25*(S.combo-1)).toFixed(2)}`:"";
  const tb=document.getElementById("tbar"); if(tb){ tb.style.width=(S.t/TIME*100)+"%"; tb.className=S.t<20?"low":""; }
  const tl=document.getElementById("tleft"); if(tl) tl.textContent=Math.ceil(S.t)+"초";
}
function paintMeter(){   // 꽂힘이 100이면 받을 배율 상한(실제는 꽂힘·뜻만큼)
  const el=document.getElementById("meter"); if(!el||!S||S.over) return;
  const n=words().length, lm=1+LEN_K*Math.max(0,n-1);
  el.innerHTML=`<span>낱말 ${n}</span><span>길이 최대 ×${lm.toFixed(1)}</span>`;
}
function paintControls(){
  const b=document.getElementById("sendBtn"); if(!b) return;
  const pr=problem(); b.disabled=S.busy||!!pr; b.textContent=pr&&S.items.length?pr:"보내기";
  const c=document.getElementById("clearBtn"); if(c) c.disabled=!S.items.length;
}
function fbHTML(){
  const f=S.fb; if(!f) return "";
  if(f.err) return `판정 실패: ${f.err}`;
  if(f.skip) return "넘겼다.";
  return `<b>「${f.said}」</b><br>${LAND_KO[f.land]} · <span class="pts">+${f.pts}</span>${f.hit?` · +${f.hard?HARD_BONUS:HIT_BONUS}초`:""}
    <div class="parts">꽂힘 ${f.d.lands.length>1?f.d.lands.map(x=>Math.round(x*100)).join("·")+"→":""}${Math.round(f.d.land_ev*100)} · 뜻 ${Math.round(f.d.sense_ev*100)} → 길이 ×${f.d.len_mult} · 새로움 ×${f.d.fresh_mult}${f.mult>1?` × ${f.hard?"빡셈·":""}콤보 ${f.mult.toFixed(2)}`:""}</div>`;
}

// ---- 누르기 ----
document.addEventListener("click",e=>{
  if(eatClick){ eatClick=false; return; }
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="startBtn") return start();
  if(!S||S.over) return;
  if(b.dataset.item){ S.items=S.items.filter(it=>it.uid!==+b.dataset.item); }            // 도화지 조각을 누르면 뺀다
  else if(b.dataset.tile){ if(onCanvas(b.dataset.tile)) S.items=S.items.filter(it=>!(it.kind==="t"&&it.id===b.dataset.tile)); else appendAt("t",b.dataset.tile); }
  else if(b.dataset.part){ appendAt("p",b.dataset.part); }
  else if(b.dataset.place){ appendAt("l",b.dataset.place); }
  else if(b.dataset.end){ if(!S.goal.rules.ending) S.end=b.dataset.end; }
  else if(b.id==="sendBtn") return send();
  else if(b.id==="clearBtn"){ S.items=[]; }
  else if(b.id==="skipBtn") return skip();
  else return;
  paint();
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&S&&!S.over) send(); });

// ---- 끌어다 놓기: 손패·조사 → 도화지(아무 데나), 도화지 안에서 옮기기, 밖으로 빼기 ----
let drag=null, eatClick=false;
document.addEventListener("pointerdown",e=>{
  if(!S||S.over||S.busy) return;
  const b=e.target.closest("button.tile"); if(!b) return;
  let src;
  if(b.dataset.item){ const it=S.items.find(x=>x.uid===+b.dataset.item); if(!it) return; src={kind:it.kind, id:it.id, uid:it.uid}; }
  else if(b.dataset.part) src={kind:"p", id:b.dataset.part};
  else if(b.dataset.place) src={kind:"l", id:b.dataset.place};
  else if(b.dataset.tile){ if(onCanvas(b.dataset.tile)) return; src={kind:"t", id:b.dataset.tile}; }
  else return;
  const r=b.getBoundingClientRect();
  drag={...src, el:b, x0:e.clientX, y0:e.clientY, dx:e.clientX-r.left, dy:e.clientY-r.top, on:false, ghost:null};
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    drag.on=true;
    const g=drag.el.cloneNode(true); g.classList.add("ghost"); g.classList.remove("used","need","fresh"); document.body.appendChild(g); drag.ghost=g;
    drag.el.classList.add("dragging");
  }
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  const cv=document.getElementById("canvas"), r=cv.getBoundingClientRect();
  cv.classList.toggle("over",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
  e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",e=>{
  if(!drag) return; const d=drag; drag=null;
  if(!d.on) return;   // 그냥 누른 것: click이 처리한다
  eatClick=true; setTimeout(()=>eatClick=false,50);
  d.ghost.remove();
  const cv=document.getElementById("canvas"), r=cv.getBoundingClientRect();
  const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  if(inside){
    const x=Math.max(2,Math.min(r.width-40,e.clientX-r.left-d.dx)), y=Math.max(2,Math.min(r.height-34,e.clientY-r.top-d.dy));
    if(d.uid){ const it=S.items.find(i=>i.uid===d.uid); if(it){ it.x=x; it.y=y; } }
    else S.items.push({uid:++uid, kind:d.kind, id:d.id, x, y});
  } else if(d.uid){ S.items=S.items.filter(i=>i.uid!==d.uid); }   // 도화지 밖으로 끌어내면 뺀다
  paint();
});
document.addEventListener("pointercancel",()=>{ if(drag&&drag.ghost) drag.ghost.remove(); drag=null; if(S&&!S.over) paint(); });

fetch("data.json").then(r=>r.json()).then(d=>{ D=d; G={...d.rush.vibes, ...d.rush.styles}; T=Object.fromEntries(d.tiles.map(t=>[t.id,t])); P=Object.fromEntries(d.particles.map(p=>[p.id,p])); L=Object.fromEntries(d.places.map(p=>[p.id,p])); paint(); });
</script>
