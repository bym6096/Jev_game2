<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄 러시</title>
<style>
:root { --bg:#111114; --panel:#1c1c21; --line:#33333a; --text:#efeff2; --dim:#8f8f98; --accent:#ffd24a; --good:#6fe08f; --bad:#ff6b61;
  --ref:#5b8cff; --adj:#3fc1c9; --pred:#5dbb6f; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; user-select:none; }
main { max-width:720px; margin:0 auto; padding:12px 16px 24px; }
.top { display:flex; align-items:center; gap:12px; }
.top .brand { font-weight:900; letter-spacing:-.4px; }
.top .brand a { color:var(--dim); font-weight:500; font-size:12px; margin-left:6px; }
.top .score { margin-left:auto; font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; }
.combo { font-size:13px; color:var(--accent); font-weight:800; min-width:56px; text-align:right; }
.timer { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 12px; }
.timer div { height:100%; background:var(--good); transition:width .25s linear; }
.timer div.low { background:var(--bad); }
.goal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; position:relative; }
.goal .lab { font-size:12px; color:var(--dim); }
.goal .vibe { font-size:34px; font-weight:900; letter-spacing:-1px; margin-top:2px; }
.goal .need { font-size:14px; color:var(--accent); margin-top:2px; min-height:20px; }
.goal .next { position:absolute; right:12px; top:10px; font-size:12px; color:var(--dim); }
.frame { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.cell { flex:1 1 70px; min-height:54px; border:1.5px dashed var(--line); border-radius:10px; padding:4px 8px; cursor:pointer; background:#17171b; display:flex; flex-direction:column; justify-content:center; }
.cell .l { font-size:10px; color:var(--dim); }
.cell .v { font-size:16px; font-weight:700; min-height:22px; }
.cell.ref{border:1.5px solid var(--ref)} .cell.adj{border:1.5px solid var(--adj)} .cell.pred{border:1.5px solid var(--pred)}
.case { font-size:10px; background:#2b2b31; border:0; color:var(--text); border-radius:5px; padding:1px 6px; cursor:pointer; align-self:flex-start; margin-top:2px; }
.ends { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.end { background:#25252b; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:4px 12px; font-size:15px; cursor:pointer; min-width:42px; }
.end.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:800; }
.said { font-size:21px; font-weight:800; margin:12px 0 8px; min-height:30px; letter-spacing:-.3px; }
.btns { display:flex; gap:8px; }
button.go { flex:1; background:var(--accent); color:#111; border:0; border-radius:12px; padding:14px; font-weight:900; font-size:17px; cursor:pointer; }
button.go.sec { flex:0 0 auto; background:#2a2a30; color:var(--text); font-weight:600; font-size:14px; padding:14px 16px; }
button:disabled { opacity:.35; cursor:default; }
.fb { min-height:44px; margin-top:10px; font-size:14px; color:var(--dim); }
.fb b { font-size:20px; color:var(--text); }
.fb .pts { color:var(--accent); font-weight:900; font-size:20px; }
.hand { margin-top:12px; display:flex; flex-direction:column; gap:7px; }
.hrow { display:flex; flex-wrap:wrap; gap:6px; }
.tile { border:1.5px solid; background:#232328; color:var(--text); border-radius:9px; padding:7px 11px; font-size:15px; cursor:pointer; transition:opacity .3s, transform .15s; }
.tile:active { transform:scale(.94); }
.tile.ref{border-color:var(--ref)} .tile.adj{border-color:var(--adj)} .tile.pred{border-color:var(--pred)}
.tile.rare { background:#352f1f; } .tile.rare::before { content:"★"; color:var(--accent); font-size:10px; margin-right:3px; }
.tile.need { box-shadow:0 0 0 2px var(--accent); }
.tile.used { opacity:.2; }
.tile.fresh { animation:pop .35s; }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
.over { text-align:center; padding:28px 12px; }
.over .big { font-size:48px; font-weight:900; }
.over ol { text-align:left; display:inline-block; margin:12px 0; color:var(--dim); }
.over ol b { color:var(--accent); }
.start { text-align:center; padding:40px 12px; color:var(--dim); }
.start h1 { color:var(--text); font-size:30px; margin:0 0 8px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const TIME=90, ROWS={ref:8, adj:5, pred:6}, FLOW_MS=6000, SKIP_COST=3, NEED_P=.35, RARE_P=.12;
const ENDS=[".","!","?","…","ㅋㅋ","ㅠㅠ"], CASE_ORDER=["obj","to","like","with","at"];
const LAND_KO={strong:"확실히 꽂힘", some:"꽤 통함", bit:"살짝", none:"안 느껴짐", opposite:"반대로 감"};
const ACCESS=new URLSearchParams(location.search).get("code")||"";
let D, T, S, timerId, flowId;

// ---- 한국어 렌더러: jev.py render_ko("short")와 같은 규칙 ----
const batchim=w=>{const c=w.charCodeAt(w.length-1)-0xAC00; return c>=0&&c<11172&&c%28!==0;};
const withCase=(w,c)=>w+({obj:batchim(w)?"을":"를", to:"에게", like:"처럼", with:batchim(w)?"과":"와", at:"에서"})[c];
const subj=w=>({"나":"내가","너":"네가"})[w]||w+(batchim(w)?"이":"가");
function render(cells,cs,end){
  const g=k=>cells[k]?T[cells[k]]:null, [sa,s,o,v]=["sa","s","o","v"].map(g), w=[];
  if(sa) w.push(sa.ko); if(s) w.push(v?subj(s.ko):s.ko); if(o) w.push(v?withCase(o.ko,cs):o.ko);
  if(v){ w.push(v.h); return w.join(" ")+end; }
  return w.length?w.join(" ")+end:"";
}

// ---- 진행 ----
const pick=a=>a[Math.floor(Math.random()*a.length)];
function randTile(cat, avoid){
  const pool=D.tiles.filter(t=>t.cat===cat&&!avoid.has(t.id)&&(Math.random()<RARE_P?true:!t.rare));
  return pick(pool).id;
}
function inHand(){ return new Set(Object.values(S.hand).flat()); }
function fill(cat){ const av=inHand(); while(S.hand[cat].length<ROWS[cat]){ const id=randTile(cat,av); av.add(id); S.hand[cat].push(id); S.fresh.add(id); } }
function newGoal(){
  const vibes=Object.keys(D.vibes); let v=pick(vibes); if(S.goal&&v===S.goal.vibe) v=pick(vibes);
  let need=null; if(Math.random()<NEED_P){ need=pick(S.hand.ref); }
  S.goal={vibe:v, need}; S.nextVibe=pick(vibes);
}
function start(){
  S={t:TIME, score:0, combo:0, hand:{ref:[],adj:[],pred:[]}, fresh:new Set(), cells:{}, cs:"obj", end:".", lines:[], fb:null, busy:false, over:false, goal:null};
  for(const c in ROWS) fill(c);
  newGoal(); paint();
  clearInterval(timerId); clearInterval(flowId);
  timerId=setInterval(()=>{ S.t=Math.max(0,S.t-.25); if(S.t<=0) finish(); paintTop(); },250);
  flowId=setInterval(flow,FLOW_MS);
}
function flow(){  // 조각이 흘러간다: 줄마다 안 쓴 조각 하나가 새것으로 바뀐다
  if(S.over) return;
  const used=new Set(Object.values(S.cells));
  for(const c in ROWS){
    const cand=S.hand[c].map((id,i)=>[id,i]).filter(([id])=>!used.has(id)&&id!==S.goal.need);
    if(!cand.length) continue;
    const [,i]=pick(cand); const av=inHand(); const id=randTile(c,av); S.hand[c][i]=id; S.fresh.add(id);
  }
  const el=document.getElementById("hand"); if(el){ el.innerHTML=handHTML(); S.fresh.clear(); }   // 손패만 다시 그린다
}
function finish(){
  if(S.over) return; S.over=true; clearInterval(timerId); clearInterval(flowId); paint();
}
async function send(){
  if(S.busy||S.over||!Object.keys(S.cells).length) return;
  if(S.goal.need&&!Object.values(S.cells).includes(S.goal.need)) return;
  S.busy=true; paintControls();
  const body={mode:"rush", vibe:S.goal.vibe, need:S.goal.need, cells:{...S.cells}, case:S.cs, ending:S.end,
    history:S.lines.slice(-5).map(l=>({cells:l.cells, case:l.cs, ending:l.end}))};
  let d;
  try{ const r=await fetch("api/judge",{method:"POST",headers:{"Content-Type":"application/json","X-Access-Code":ACCESS},body:JSON.stringify(body)}); d=await r.json(); if(!r.ok) throw new Error(d.error||r.status); }
  catch(e){ S.fb={err:e.message}; S.busy=false; paint(); return; }
  if(S.over){ S.busy=false; return; }
  const hit=d.score>=60;
  S.combo=hit?S.combo+1:0;
  const mult=Math.min(3,1+.25*Math.max(0,S.combo-1));
  const pts=Math.round(d.score*mult);
  S.score+=pts;
  const land=Object.entries(d.land).sort((a,b)=>b[1]-a[1])[0][0];
  S.lines.push({cells:{...S.cells}, cs:S.cs, end:S.end, said:d.said, vibe:S.goal.vibe, pts});
  S.fb={said:d.said, land, pts, mult, raw:d.score};
  const used=new Set(Object.values(S.cells));
  for(const c in ROWS){ S.hand[c]=S.hand[c].filter(id=>!used.has(id)); fill(c); }
  S.cells={}; S.end="."; S.cs="obj"; newGoal(); S.busy=false; paint();
}
function skip(){ if(S.over||S.busy) return; S.t=Math.max(0,S.t-SKIP_COST); S.combo=0; S.fb={skip:true}; newGoal(); paint(); }
function place(id){
  const t=T[id]; const at=Object.keys(S.cells).find(k=>S.cells[k]===id);
  if(at){ delete S.cells[at]; return; }
  if(t.cat==="adj") S.cells.sa=id;
  else if(t.cat==="pred") S.cells.v=id;
  else if(!S.cells.s) S.cells.s=id; else S.cells.o=id;
}

// ---- 그리기 ----
const app=document.getElementById("app");
function paint(){
  if(!S){ app.innerHTML=`<div class="start"><h1>한 줄 러시</h1><p>${TIME}초. 떨어지는 목표에 맞는 한 줄을 빠르게 지어 보낸다.<br>조각을 누르면 틀에 들어가고, 다시 누르면 빠진다. 끝맺음으로 뉘앙스를 바꾼다.<br>60점 넘게 연속으로 꽂으면 콤보.</p><button class="go" id="startBtn" style="max-width:260px">시작</button><p style="margin-top:18px"><a href="./" style="color:var(--dim)">← 한 줄 공방</a></p></div>`; return; }
  if(S.over){
    const best=[...S.lines].sort((a,b)=>b.pts-a.pts).slice(0,5);
    app.innerHTML=`<div class="over"><div>끝!</div><div class="big">${S.score}</div><div style="color:var(--dim)">${S.lines.length}줄</div>
      <ol>${best.map(l=>`<li>「${l.said}」 ${D.vibes[l.vibe]} <b>+${l.pts}</b></li>`).join("")}</ol>
      <div><button class="go" id="startBtn" style="max-width:260px">다시</button></div></div>`; return;
  }
  const g=S.goal;
  app.innerHTML=`
    <div class="top"><span class="brand">한 줄 러시<a href="./">공방</a></span><span class="combo" id="combo"></span><span class="score" id="score"></span></div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="goal"><span class="next">다음: ${D.vibes[S.nextVibe]}</span><div class="lab">이 느낌으로</div><div class="vibe">${D.vibes[g.vibe]}</div>
      <div class="need">${g.need?`'${T[g.need].ko}'를 넣어서`:""}</div></div>
    <div class="frame">${D.forms.short.cells.map(c=>{const id=S.cells[c.id], t=id?T[id]:null;
      return `<div class="cell ${t?t.cat:""}" data-cell="${c.id}"><span class="l">${c.case?D.cases[S.cs]:c.label}</span><span class="v">${t?t.ko:""}</span>${c.case?`<button class="case" data-case="1">격</button>`:""}</div>`;}).join("")}</div>
    <div class="ends">${ENDS.map(e=>`<button class="end ${e===S.end?"on":""}" data-end="${e}">${e}</button>`).join("")}</div>
    <div class="said">${Object.keys(S.cells).length?`「${render(S.cells,S.cs,S.end)}」`:""}</div>
    <div class="btns"><button class="go" id="sendBtn">보내기</button><button class="go sec" id="skipBtn">넘기기 −${SKIP_COST}초</button></div>
    <div class="fb">${fbHTML()}</div>
    <div class="hand" id="hand">${handHTML()}</div>`;
  S.fresh.clear(); paintTop(); paintControls();
}
function handHTML(){
  const g=S.goal, used=new Set(Object.values(S.cells));
  return Object.keys(ROWS).map(c=>`<div class="hrow">${S.hand[c].map(id=>{const t=T[id];
    return `<button class="tile ${t.cat}${t.rare?" rare":""}${used.has(id)?" used":""}${id===g.need?" need":""}${S.fresh.has(id)?" fresh":""}" data-tile="${id}">${t.ko}</button>`;}).join("")}</div>`).join("");
}
function paintTop(){
  if(!S||S.over) return;
  const sc=document.getElementById("score"); if(sc) sc.textContent=S.score;
  const cb=document.getElementById("combo"); if(cb) cb.textContent=S.combo>1?`${S.combo}콤보 ×${Math.min(3,1+.25*(S.combo-1)).toFixed(2)}`:"";
  const tb=document.getElementById("tbar"); if(tb){ tb.style.width=(S.t/TIME*100)+"%"; tb.className=S.t<15?"low":""; }
}
function paintControls(){
  const b=document.getElementById("sendBtn"); if(!b) return;
  const missing=S.goal.need&&!Object.values(S.cells).includes(S.goal.need);
  b.disabled=S.busy||!Object.keys(S.cells).length||missing;
  b.textContent=missing&&Object.keys(S.cells).length?`'${T[S.goal.need].ko}' 넣기`:"보내기";
}
function fbHTML(){
  const f=S.fb; if(!f) return "";
  if(f.err) return `판정 실패: ${f.err}`;
  if(f.skip) return "넘겼다.";
  return `<b>「${f.said}」</b><br>${LAND_KO[f.land]} · <span class="pts">+${f.pts}</span>${f.mult>1?` (${f.raw} × ${f.mult.toFixed(2)})`:""}`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,.cell"); if(!b) return;
  if(b.id==="startBtn") return start();
  if(!S||S.over) return;
  if(b.dataset.tile) place(b.dataset.tile);
  else if(b.dataset.case){ S.cs=CASE_ORDER[(CASE_ORDER.indexOf(S.cs)+1)%CASE_ORDER.length]; }
  else if(b.dataset.cell){ delete S.cells[b.dataset.cell]; }
  else if(b.dataset.end){ S.end=b.dataset.end; }
  else if(b.id==="sendBtn") return send();
  else if(b.id==="skipBtn") return skip();
  else return;
  paint();
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&S&&!S.over) send(); });
fetch("data.json").then(r=>r.json()).then(d=>{ D=d; T=Object.fromEntries(d.tiles.map(t=>[t.id,t])); paint(); });
</script>
</body>
</html>
