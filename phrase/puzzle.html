<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄 퍼즐</title>
<style>
:root { --bg:#111114; --panel:#1c1c21; --line:#33333a; --text:#efeff2; --dim:#8f8f98; --accent:#ffd24a; --good:#6fe08f; --bad:#ff6b61;
  --ref:#5b8cff; --adj:#3fc1c9; --pred:#5dbb6f; --mod:#e0a93f; --part:#c58cff; --place:#f08c5a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
main { max-width:720px; margin:0 auto; padding:12px 16px 24px; }
.top { display:flex; align-items:baseline; gap:12px; }
.top .brand { font-weight:900; letter-spacing:-.4px; }
.top .brand a { color:var(--dim); font-weight:500; font-size:12px; margin-left:6px; }
.top .stage { color:var(--dim); font-size:13px; }
.top .stage b { color:var(--text); }
.top .score { margin-left:auto; font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; }
.cut { margin:8px 0 10px; }
.cut .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; position:relative; }
.cut .bar div { height:100%; background:var(--good); transition:width .5s; }
.cut .txt { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:3px; font-variant-numeric:tabular-nums; }
.pips { display:flex; gap:4px; }
.pip { width:18px; height:6px; border-radius:3px; background:var(--line); }
.pip.done { background:var(--good); } .pip.now { background:var(--accent); } .pip.hard { outline:1px solid var(--bad); }
.goal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; text-align:center; }
.goal.hard { border:1.5px solid var(--bad); background:#241618; }
.goal .lab { font-size:12px; color:var(--dim); }
.hardtag { color:var(--bad); font-weight:900; }
.goal .vibe { font-size:28px; font-weight:900; letter-spacing:-1px; }
.goal .vibe.theme { font-size:21px; letter-spacing:-.5px; line-height:1.3; margin:4px 0; }
.given { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
.canvas { position:relative; height:170px; margin-top:10px; border:1.5px dashed var(--line); border-radius:12px; overflow:hidden;
  background:repeating-linear-gradient(to bottom, transparent 0 41px, #ffffff0a 41px 42px), #16161a; touch-action:none; }
.canvas.over { border-color:var(--accent); }
.canvas .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; pointer-events:none; text-align:center; padding:0 20px; }
.chip { position:absolute; }
.ends { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.end { background:#25252b; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:4px 12px; font-size:15px; cursor:pointer; min-width:42px; }
.end.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:800; }
.said { font-size:21px; font-weight:800; margin:10px 0 4px; min-height:30px; letter-spacing:-.3px; }
.meter { font-size:12px; color:var(--dim); margin:0 0 8px; }
.btns { display:flex; gap:8px; }
button.go { flex:1; background:var(--accent); color:#111; border:0; border-radius:12px; padding:13px; font-weight:900; font-size:17px; cursor:pointer; }
button.go.sec { flex:0 0 auto; background:#2a2a30; color:var(--text); font-weight:600; font-size:14px; padding:13px 14px; }
button:disabled { opacity:.35; cursor:default; }
.result { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:10px; text-align:center; }
.result .line { font-size:20px; font-weight:800; }
.result .pts { font-size:34px; font-weight:900; color:var(--accent); margin-top:4px; }
.result .parts { font-size:12px; color:var(--dim); margin-top:4px; }
.result .land { font-size:14px; margin-top:6px; }
.tile { border:1.5px solid; background:#232328; color:var(--text); border-radius:9px; padding:6px 10px; font-size:15px; cursor:grab; touch-action:none; white-space:nowrap; }
.tile.ref{border-color:var(--ref)} .tile.adj{border-color:var(--adj)} .tile.pred{border-color:var(--pred)} .tile.mod{border-color:var(--mod)}
.tile.part { border-color:var(--part); border-style:dashed; padding:5px 9px; font-size:14px; }
.tile.place { border-color:var(--place); border-style:dashed; padding:5px 9px; font-size:14px; }
.tile.rare { background:#352f1f; } .tile.rare::before { content:"★"; color:var(--accent); font-size:10px; margin-right:3px; }
.tile.used { opacity:.2; }
.tile.dragging { opacity:.25; }
.palette { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
.palette .lab { font-size:11px; color:var(--dim); width:100%; }
.ghost { position:fixed; z-index:50; pointer-events:none; box-shadow:0 6px 18px #0008; }
.screen { text-align:center; padding:28px 12px; color:var(--dim); }
.screen h1 { color:var(--text); font-size:30px; margin:0 0 8px; }
.screen .big { font-size:46px; font-weight:900; color:var(--text); }
.screen .pass { color:var(--good); font-weight:900; font-size:22px; }
.screen .fail { color:var(--bad); font-weight:900; font-size:22px; }
.screen ol { text-align:left; display:inline-block; margin:12px 0; }
.screen ol b { color:var(--accent); }
.modes { display:flex; gap:6px; justify-content:center; padding:10px 16px 0; max-width:780px; margin:0 auto; }
.modes a { font-size:13px; font-weight:700; color:#8f8f98; text-decoration:none; padding:5px 14px; border-radius:999px; border:1px solid #33333a; }
.modes a.on { color:#111; background:#ffd24a; border-color:#ffd24a; }
</style>
</head>
<body>
<nav class="modes"><a href="./">한 줄 공방</a><a href="rush.html">한 줄 러시</a><a href="puzzle.html" class="on">한 줄 퍼즐</a></nav>
<script>document.querySelectorAll(".modes a").forEach(a=>{ a.href=a.getAttribute("href")+location.search; });   // 접근 코드(?code=)를 다음 화면에도 넘긴다</script>
<main id="app"></main>
<script>
const PER_BLOCK=5, START_WORDS=3, HARD_MULT=2, LEN_K=.4, STYLE_P=.2, REROLLS=2;   // 새로 받기: 구간마다 2번, 다음 구간으로 안 넘어감
const ENDS=[".","!","?","…","ㅋㅋ","ㅠㅠ"], ROW_H=42;
const LAND_KO={strong:"확실히 꽂힘", some:"꽤 통함", bit:"살짝", none:"안 느껴짐", opposite:"반대로 감"};
const ACCESS=new URLSearchParams(location.search).get("code")||"";
let D, T, P, L, G, S, uid=0;
const wordsIn=block=>START_WORDS+block;                                   // 구간마다 낱말 하나씩 늘어난다
const cutOf=block=>290+10*block;   // 구간 정산 컷. 낱말이 늘수록 판 자체가 어려워져서(측정: 5낱말 판 평균이 3낱말 판보다 낮다) 컷은 거의 평평하게

// ---- 한국어 렌더러: jev.py render_free_ko와 같은 규칙 ----
const code=w=>w.charCodeAt(w.length-1)-0xAC00;
const batchim=w=>{const c=code(w); return c>=0&&c<11172&&c%28!==0;};
const jong=w=>{const c=code(w); return c>=0&&c<11172?c%28:0;};
function attach(w,pid){
  const p=P[pid];
  if(pid==="subj"&&(w==="나"||w==="너")) return w==="나"?"내가":"네가";
  if(pid==="dir"){ const j=jong(w); return w+(j&&j!==8?"으로":"로"); }
  return w+(batchim(w)?p.b:p.nb);
}
function renderTokens(tokens,end){
  let last=-1; tokens.forEach((k,i)=>{ if(k.t&&T[k.t].cat==="pred") last=i; });
  const out=[];
  tokens.forEach((k,i)=>{
    if(k.p){ if(out.length) out[out.length-1]=attach(out[out.length-1],k.p); return; }
    if(k.l){ out.push(L[k.l].ko); return; }
    const t=T[k.t]; out.push(t.cat==="pred"?(i===last?t.h:t.st+"고"):t.ko);
  });
  return out.length?out.join(" ")+end:"";
}

// ---- 도화지 ----
const order=()=>[...S.items].sort((a,b)=>(Math.floor(a.y/ROW_H)-Math.floor(b.y/ROW_H))||(a.x-b.x));
const tokens=()=>order().map(it=>it.kind==="p"?{p:it.id}:it.kind==="l"?{l:it.id}:{t:it.id});
const label=it=>it.kind==="p"?P[it.id].ko:it.kind==="l"?L[it.id].ko:T[it.id].ko;
const onCanvas=id=>S.items.some(it=>it.kind==="t"&&it.id===id);
function appendAt(kind,id){
  const cv=document.getElementById("canvas"); if(!cv) return;
  const W=cv.clientWidth, o=order(), last=o[o.length-1];
  let x=10, y=8;
  if(last){ const el=cv.querySelector(`[data-uid="${last.uid}"]`); const w=el?el.offsetWidth:60; x=last.x+w+6; y=Math.floor(last.y/ROW_H)*ROW_H+8;
    if(x+label({kind,id}).length*16+28>W-6){ x=10; y+=ROW_H; } }
  if(y>cv.clientHeight-30) return;
  S.items.push({uid:++uid, kind, id, x, y});
}

// ---- 진행 ----
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;};
function dealWords(n,block){   // 서술어 1~2개, 지시 절반쯤, 나머지는 꾸밈·어떻게
  const rareP=Math.min(.35,.08*block), used=new Set(), out=[];
  const take=cat=>{ const pool=D.tiles.filter(t=>t.cat===cat&&!used.has(t.id)&&(Math.random()<rareP||!t.rare)); const id=pick(pool).id; used.add(id); out.push(id); };
  const preds=n>=6?2:1, refs=Math.max(1,Math.floor((n-preds)/2)+(n>=4?1:0));
  for(let i=0;i<preds;i++) take("pred");
  for(let i=0;i<Math.min(refs,n-preds);i++) take("ref");
  while(out.length<n) take(Math.random()<.6?"adj":"mod");
  return shuffle(out);
}
function newRun(){ S={block:0, stage:0, total:0, blockScore:0, rerolls:REROLLS, lines:[], usedThemes:new Set(), phase:"play"}; newStage(); }
function reroll(){ if(S.phase!=="play"||S.busy||!S.rerolls) return; S.rerolls--; newStage(); }   // 목표와 낱말을 다 새로
function newStage(){
  const hard=S.stage===PER_BLOCK-1;   // 구간 마지막 스테이지는 어려운 주제
  let goal;
  if(hard){ const th=pick(Object.keys(D.rush.themes).filter(t=>!S.usedThemes.has(t)))||pick(Object.keys(D.rush.themes)); S.usedThemes.add(th); goal={theme:th}; }
  else goal={vibes:[Math.random()<STYLE_P?pick(Object.keys(D.rush.styles)):pick(Object.keys(D.rush.vibes))]};
  Object.assign(S,{goal, hard, given:dealWords(wordsIn(S.block),S.block), items:[], end:".", last:null, busy:false, phase:"play"});
  paint();
}
const goalLabel=g=>g.theme?D.rush.themes[g.theme]:g.vibes.map(v=>G[v]).join(" + ");
function problem(){
  const left=S.given.filter(id=>!onCanvas(id));
  if(!S.items.length) return "낱말을 올려놓는다";
  if(left.length) return `${left.length}개 남음: ${left.map(id=>T[id].ko).join(", ")}`;
  return "";
}
async function send(){
  if(S.busy||problem()) return;
  S.busy=true; paint();
  const toks=tokens();
  const goal={...S.goal, rules:{need:S.given, words_eq:S.given.length}};
  let d;
  try{ const r=await fetch("api/judge",{method:"POST",headers:{"Content-Type":"application/json","X-Access-Code":ACCESS},body:JSON.stringify({mode:"rush", goal, tokens:toks, ending:S.end, history:[]})}); d=await r.json(); if(!r.ok) throw new Error(d.error||r.status); }
  catch(e){ S.busy=false; S.err=e.message; paint(); return; }
  const pts=Math.round(d.score*(S.hard?HARD_MULT:1));
  S.total+=pts; S.blockScore+=pts;
  S.lines.push({said:d.said, label:goalLabel(S.goal), pts, hard:S.hard, block:S.block});
  S.last={d, pts}; S.err=null; S.busy=false; S.phase="result"; paint();
}
function next(){
  if(S.stage<PER_BLOCK-1){ S.stage++; newStage(); return; }
  S.phase="settle"; paint();   // 구간 끝: 정산
}
function afterSettle(){
  if(S.blockScore>=cutOf(S.block)){ S.block++; S.stage=0; S.blockScore=0; S.rerolls=REROLLS; newStage(); }
  else { S.phase="over"; paint(); }
}

// ---- 그리기 ----
const app=document.getElementById("app");
const tileHTML=(id,extra="",attr=`data-tile="${id}"`)=>{const t=T[id]; return `<button class="tile ${t.cat}${t.rare?" rare":""}${extra}" ${attr}>${t.ko}</button>`;};
function header(){
  const cut=cutOf(S.block), pips=Array.from({length:PER_BLOCK},(_,i)=>`<div class="pip ${i<S.stage||(i===S.stage&&S.phase!=="play")?"done":i===S.stage?"now":""} ${i===PER_BLOCK-1?"hard":""}"></div>`).join("");
  return `<div class="top"><span class="brand">한 줄 퍼즐</span>
      <span class="stage">구간 <b>${S.block+1}</b> · 스테이지 <b>${S.stage+1}/${PER_BLOCK}</b> · 낱말 <b>${wordsIn(S.block)}</b></span><span class="score">${S.total}</span></div>
    <div class="cut"><div class="bar"><div style="width:${Math.min(100,S.blockScore/cut*100)}%"></div></div>
      <div class="txt"><span class="pips">${pips}</span><span>이번 구간 ${S.blockScore} / 정산 컷 ${cut}</span></div></div>`;
}
function paint(){
  if(!S){ app.innerHTML=`<div class="screen"><h1>한 줄 퍼즐</h1><p>목표와 낱말 조각이 주어진다. <b style="color:var(--text)">낱말은 전부 써야 하고, 기회는 한 번.</b><br>
    조사·위치 말·끝맺음은 마음대로. 도화지에 놓은 순서대로 읽힌다.<br>
    ${PER_BLOCK}스테이지마다 낱말이 하나씩 늘고, 구간 마지막은 어려운 주제(×${HARD_MULT}).<br>구간이 끝나면 정산 — 그 구간 점수가 컷을 넘어야 다음으로.<br>안 맞는 판은 새로 받을 수 있다: 구간마다 ${REROLLS}번(다음 구간으로 안 넘어감).</p>
    <button class="go" id="startBtn" style="max-width:260px">시작</button></div>`; return; }
  if(S.phase==="settle"){
    const cut=cutOf(S.block), ok=S.blockScore>=cut;
    app.innerHTML=`${header()}<div class="screen"><div>구간 ${S.block+1} 정산</div><div class="big">${S.blockScore} / ${cut}</div>
      <div class="${ok?"pass":"fail"}">${ok?"통과!":"컷 미달"}</div>
      <p>${ok?`다음 구간은 낱말 ${wordsIn(S.block+1)}개, 컷 ${cutOf(S.block+1)}`:""}</p>
      <button class="go" id="settleBtn" style="max-width:260px">${ok?"다음 구간":"결과 보기"}</button></div>`; return;
  }
  if(S.phase==="over"){
    const best=[...S.lines].sort((a,b)=>b.pts-a.pts).slice(0,5);
    app.innerHTML=`<div class="screen"><div>끝 — 구간 ${S.block+1}에서 멈춤</div><div class="big">${S.total}</div><div>${S.lines.length}줄</div>
      <ol>${best.map(l=>`<li>「${l.said}」 ${l.hard?"🔥":""}${l.label} <b>+${l.pts}</b></li>`).join("")}</ol>
      <div><button class="go" id="startBtn" style="max-width:260px">다시</button></div></div>`; return;
  }
  const g=S.goal, play=S.phase==="play";
  app.innerHTML=`${header()}
    <div class="goal ${S.hard?"hard":""}"><div class="lab">${S.hard?`<span class="hardtag">어려운 주제 ×${HARD_MULT}</span> · 이 장면이 떠오르게`:"이 느낌으로"}</div>
      <div class="vibe ${g.theme?"theme":""}">${goalLabel(g)}</div>
      <div class="given">${S.given.map(id=>tileHTML(id,onCanvas(id)?" used":"")).join("")}</div></div>
    <div class="canvas" id="canvas">${S.items.length?"":`<div class="hint">낱말을 전부 도화지에 놓고, 조사·위치 말로 잇는다</div>`}${S.items.map(it=>{
      const html=it.kind==="t"?tileHTML(it.id,"",`data-item="${it.uid}"`):`<button class="tile ${it.kind==="p"?"part":"place"}" data-item="${it.uid}">${label(it)}</button>`;
      return `<div class="chip" data-uid="${it.uid}" style="left:${it.x}px;top:${it.y}px">${html}</div>`;}).join("")}</div>
    <div class="ends">${ENDS.map(e=>`<button class="end ${e===S.end?"on":""}" data-end="${e}" ${play?"":"disabled"}>${e}</button>`).join("")}</div>
    <div class="said">${S.items.length?`「${renderTokens(tokens(),S.end)}」`:""}</div>
    <div class="meter">낱말 ${S.given.length}개 → 꽂히고 말이 되면 길이 최대 ×${(1+LEN_K*(S.given.length-1)).toFixed(1)}</div>
    ${play?`<div class="btns"><button class="go" id="sendBtn" ${S.busy||problem()?"disabled":""}>${S.busy?"판정 중…":problem()&&S.items.length?problem():"이걸로 낸다 (한 번뿐)"}</button><button class="go sec" id="clearBtn" ${S.items.length?"":"disabled"}>비우기</button><button class="go sec" id="rerollBtn" ${S.rerolls&&!S.busy?"":"disabled"}>판 새로 받기 (${S.rerolls})</button></div>`:""}
    ${S.err?`<div class="meter" style="color:var(--bad)">판정 실패: ${S.err}</div>`:""}
    ${S.phase==="result"?resultHTML():""}
    ${play?`<div class="palette"><span class="lab">조사 — 무제한</span>${D.particles.map(p=>`<button class="tile part" data-part="${p.id}">${p.ko}</button>`).join("")}
      <span class="lab" style="margin-top:4px">위치 — 무제한</span>${D.places.map(p=>`<button class="tile place" data-place="${p.id}">${p.ko}</button>`).join("")}</div>`:""}`;
}
function resultHTML(){
  const {d,pts}=S.last;
  return `<div class="result"><div class="line">「${d.said}」</div><div class="pts">+${pts}</div>
    <div class="land">${LAND_KO[d.land_top]}</div>
    <div class="parts">꽂힘 ${Math.round(d.land_ev*100)} · 뜻 ${Math.round(d.sense_ev*100)} → 길이 ×${d.len_mult} · 새로움 ×${d.fresh_mult}${S.hard?` · 어려운 주제 ×${HARD_MULT}`:""}</div>
    <div class="btns" style="margin-top:10px"><button class="go" id="nextBtn">${S.stage<PER_BLOCK-1?"다음 스테이지":"정산하기"}</button></div></div>`;
}

// ---- 누르기 ----
document.addEventListener("click",e=>{
  if(eatClick){ eatClick=false; return; }
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="startBtn") return newRun();
  if(!S) return;
  if(b.id==="nextBtn") return next();
  if(b.id==="settleBtn") return afterSettle();
  if(S.phase!=="play"||S.busy) return;
  if(b.dataset.item){ S.items=S.items.filter(it=>it.uid!==+b.dataset.item); }
  else if(b.dataset.tile){ if(onCanvas(b.dataset.tile)) S.items=S.items.filter(it=>!(it.kind==="t"&&it.id===b.dataset.tile)); else appendAt("t",b.dataset.tile); }
  else if(b.dataset.part){ appendAt("p",b.dataset.part); }
  else if(b.dataset.place){ appendAt("l",b.dataset.place); }
  else if(b.dataset.end){ S.end=b.dataset.end; }
  else if(b.id==="sendBtn") return send();
  else if(b.id==="clearBtn"){ S.items=[]; }
  else if(b.id==="rerollBtn") return reroll();
  else return;
  paint();
});

// ---- 끌어다 놓기 ----
let drag=null, eatClick=false;
document.addEventListener("pointerdown",e=>{
  if(!S||S.phase!=="play"||S.busy) return;
  const b=e.target.closest("button.tile"); if(!b) return;
  let src;
  if(b.dataset.item){ const it=S.items.find(x=>x.uid===+b.dataset.item); if(!it) return; src={kind:it.kind, id:it.id, uid:it.uid}; }
  else if(b.dataset.part) src={kind:"p", id:b.dataset.part};
  else if(b.dataset.place) src={kind:"l", id:b.dataset.place};
  else if(b.dataset.tile){ if(onCanvas(b.dataset.tile)) return; src={kind:"t", id:b.dataset.tile}; }
  else return;
  const r=b.getBoundingClientRect();
  drag={...src, el:b, x0:e.clientX, y0:e.clientY, dx:e.clientX-r.left, dy:e.clientY-r.top, on:false, ghost:null};
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    drag.on=true;
    const g=drag.el.cloneNode(true); g.classList.add("ghost"); g.classList.remove("used"); document.body.appendChild(g); drag.ghost=g;
    drag.el.classList.add("dragging");
  }
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  const cv=document.getElementById("canvas"), r=cv.getBoundingClientRect();
  cv.classList.toggle("over",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
  e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",e=>{
  if(!drag) return; const d=drag; drag=null;
  if(!d.on) return;
  eatClick=true; setTimeout(()=>eatClick=false,50);
  d.ghost.remove();
  const cv=document.getElementById("canvas"), r=cv.getBoundingClientRect();
  const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  if(inside){
    const x=Math.max(2,Math.min(r.width-40,e.clientX-r.left-d.dx)), y=Math.max(2,Math.min(r.height-34,e.clientY-r.top-d.dy));
    if(d.uid){ const it=S.items.find(i=>i.uid===d.uid); if(it){ it.x=x; it.y=y; } }
    else S.items.push({uid:++uid, kind:d.kind, id:d.id, x, y});
  } else if(d.uid){ S.items=S.items.filter(i=>i.uid!==d.uid); }
  paint();
});
document.addEventListener("pointercancel",()=>{ if(drag&&drag.ghost) drag.ghost.remove(); drag=null; if(S) paint(); });

fetch("data.json").then(r=>r.json()).then(d=>{ D=d; G={...d.rush.vibes, ...d.rush.styles}; T=Object.fromEntries(d.tiles.map(t=>[t.id,t]));
  P=Object.fromEntries(d.particles.map(p=>[p.id,p])); L=Object.fromEntries(d.places.map(p=>[p.id,p])); paint(); });
</script>
